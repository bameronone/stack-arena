<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Stack Arena</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2315131a%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M32%206%2054%2014v18c0%2013-9%2022-22%2027C19%2054%2010%2045%2010%2032V14z%22%20fill%3D%22%232a2530%22%20stroke%3D%22%23d6a24e%22%20stroke-width%3D%223.5%22%20stroke-linejoin%3D%22round%22%2F%3E%0A%20%20%3Cg%20fill%3D%22%23d6a24e%22%3E%0A%20%20%20%20%3Cpath%20d%3D%22M18%2038h28l-3%206H21z%22%20opacity%3D%22.55%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M18%2029h28l-3%206H21z%22%20opacity%3D%22.8%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M18%2020h28l-3%206H21z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%3C%2Fsvg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=Grenze+Gotisch:wght@400;600&display=swap">
<style>
/* Layout: one-screen arena. HUD on top, the pit in the middle flanked by the
   two builds, the shop tray along the bottom like a merchant's table. */
:root {
  --night: #15131a;        /* page ground */
  --pit: #1f1b24;          /* panels */
  --pit-2: #2a2530;        /* raised panels, cards */
  --line: #3b3442;
  --sand: #e9dcc0;         /* main text */
  --dust: #a99c87;         /* muted text */
  --bronze: #d6a24e;       /* accent: gold, buttons, the crowd's favor */
  --bronze-ink: #2a1d08;
  --blood: #d9505e;
  --life: #7fca6e;
  --mana: #5b8cff;
  --display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--sand);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}
#app { height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 11px; color: var(--dust); font-weight: 600; }

.btn {
  border: 1px solid var(--line); background: var(--pit-2); border-radius: 6px;
  padding: 8px 14px; font-weight: 600; letter-spacing: 0.02em;
}
.btn:hover:not(:disabled) { border-color: var(--dust); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--bronze); color: var(--bronze-ink); border-color: var(--bronze); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.on { border-color: var(--bronze); color: var(--bronze); }

/* Tag chips */
.chip {
  display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
  border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap;
}
.chip.trigger { border-style: dashed; }
.arrow { color: var(--dust); font-size: 11px; }

/* ---------- Title / ban / pick screens ---------- */
.screen {
  flex: 1; overflow-y: auto;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen-inner { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.brand { font-family: var(--display); font-size: clamp(54px, 11vw, 112px); line-height: 0.9; color: var(--sand); }
.brand span { color: var(--bronze); }
.lede { max-width: 62ch; color: var(--dust); font-size: 17px; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.rule { background: var(--pit); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rule h3 { font-size: 22px; color: var(--bronze); }
.rule p { margin: 0; color: var(--dust); }
.tag-legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 18px; }
.tag-legend div { display: flex; gap: 8px; align-items: baseline; color: var(--dust); font-size: 13px; min-width: 0; }
.tag-legend .chip { flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lobby { display: flex; flex-direction: column; gap: 10px; max-width: 760px; }
.lobby .rec { color: var(--sand); }
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot {
  display: grid; grid-template-columns: 28px 110px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--pit); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0;
}
.slot b { font-family: var(--display); font-size: 22px; font-weight: 400; line-height: 1; }
.slot.you { border-color: var(--bronze); }
.slot.you b { color: var(--bronze); }
.slot-n { color: var(--dust); font-size: 13px; }
.slot-note { color: var(--dust); font-size: 13px; }
.slot.add { text-align: left; border-style: dashed; color: var(--dust); }
.slot.add:hover { border-color: var(--bronze); color: var(--sand); }
.slot-x { background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--dust); font-size: 12px; padding: 3px 8px; }
.slot-x:hover { color: var(--blood); border-color: var(--blood); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; width: max-content; max-width: 100%; }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 4px 10px; font-size: 13px; color: var(--dust); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--bronze); color: var(--bronze-ink); font-weight: 700; }
.seg button:not(.on):hover { color: var(--sand); }

.standings { display: flex; flex-direction: column; gap: 3px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.st { display: grid; grid-template-columns: 26px minmax(0, 1fr) 50px 24px; gap: 6px; align-items: center; font-size: 12px; padding: 2px 4px; border-radius: 4px; }
.st-n { color: var(--dust); }
.st-name { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.st-name small { color: var(--dust); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-bar { height: 6px; background: var(--night); border-radius: 3px; overflow: hidden; }
.st-bar i { display: block; height: 100%; background: var(--life); }
.st-hp { text-align: right; }
.st.me { background: color-mix(in srgb, var(--bronze) 14%, transparent); }
.st.opp { box-shadow: inset 0 0 0 1px var(--blood); }
.st.opp .st-bar i { background: var(--blood); }
.st.out { opacity: 0.45; }

.others { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--dust); display: flex; flex-direction: column; gap: 2px; }
.others li { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.others .watch { padding: 2px 8px; font-size: 11px; }
.final { border-collapse: collapse; width: 100%; max-width: 640px; font-size: 14px; }
.final th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dust); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.final td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.final .num { text-align: right; }
.final tr.me td { color: var(--bronze); font-weight: 700; }

.btn.big { font-family: var(--display); font-size: 26px; font-weight: 400; padding: 6px 28px; }
.btn.primary.is-ready { background: var(--life); border-color: var(--life); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); max-width: 760px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--dust); font-weight: 600; margin-bottom: -1px; }
.tabs button.on { color: var(--bronze); border-bottom-color: var(--bronze); }
.notice { background: var(--pit); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; color: var(--dust); }
.notice b { color: var(--sand); }
.notice a { color: var(--bronze); }
.field { display: flex; flex-direction: column; gap: 4px; max-width: 280px; }
input { font: inherit; color: var(--sand); background: var(--night); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; min-width: 0; }
input:focus-visible { outline: 2px solid var(--bronze); outline-offset: 1px; }
.online-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.code-input { width: 8.5em; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; font-variant-numeric: tabular-nums; }
.link { flex: 1; min-width: 0; max-width: 460px; color: var(--dust); }
.room-code { color: var(--bronze); letter-spacing: 0.12em; }
.slot.room { grid-template-columns: 28px 140px minmax(0, 1fr) auto; }
.slot b.open { color: var(--dust); }
.slot-ctl { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
.timer { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--sand); font-variant-numeric: tabular-nums; }
.timer.urgent { color: var(--blood); }
.waiting { color: var(--dust); }
.char.chosen { border-color: var(--bronze); box-shadow: inset 0 0 0 1px var(--bronze); }
.char:disabled { cursor: default; }
.char:disabled:not(.chosen) { opacity: 0.55; }
.st-name em { font-style: normal; font-size: 10px; color: var(--bronze); text-transform: uppercase; letter-spacing: 0.08em; }
.spectate { flex: 1; text-align: center; color: var(--dust); padding: 14px 0; }

.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; max-width: 760px; }
.level {
  text-align: left; background: var(--pit); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.level b { font-family: var(--display); font-size: 24px; font-weight: 400; line-height: 1; }
.level span { color: var(--dust); font-size: 13px; }
.level .rec { color: var(--sand); font-size: 12px; }
.level:hover { border-color: var(--dust); }
.level.on { border-color: var(--bronze); box-shadow: inset 0 0 0 1px var(--bronze); }
.level.on b { color: var(--bronze); }

.ban-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.ban-tile {
  text-align: left; border: 1px solid var(--line); background: var(--pit); border-radius: 8px;
  padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative;
}
.ban-tile:hover { border-color: var(--c); }
.ban-tile .name { font-family: var(--display); font-size: 26px; color: var(--c); }
.ban-tile p { margin: 0; color: var(--dust); font-size: 13px; }
.ban-tile .who { font-size: 12px; color: var(--dust); }
.ban-tile.banned { opacity: 0.55; border-color: var(--blood); }
.ban-tile.banned .name { text-decoration: line-through; text-decoration-color: var(--blood); }
.stamp {
  position: absolute; top: 12px; right: 12px; font-family: var(--display); font-size: 20px; color: var(--blood);
  border: 2px solid var(--blood); padding: 0 8px; border-radius: 4px; transform: rotate(-8deg);
}

.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.char {
  text-align: left; border: 1px solid var(--line); background: var(--pit); border-radius: 8px; padding: 14px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.char:hover { border-color: var(--bronze); }
.char .nm { font-family: var(--display); font-size: 28px; line-height: 1; }
.char .ep { color: var(--dust); font-size: 13px; font-style: italic; }
.char .ab { font-size: 13px; color: var(--sand); }
.char .ab b { color: var(--bronze); font-weight: 600; }
.char .inn { font-size: 13px; color: var(--dust); }
.char .stats { font-size: 12px; color: var(--dust); }
.warn { font-size: 12px; color: var(--blood); font-weight: 600; }
.hidden-note { color: var(--dust); font-size: 13px; }

/* ---------- Game ---------- */
.hud {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--pit);
}
.hud .logo { font-family: var(--display); font-size: 26px; line-height: 1; }
.hud .logo span { color: var(--bronze); }
.hud .vs { display: flex; gap: 14px; justify-content: flex-end; min-width: 260px; flex: 0 1 480px; }
/* Rounds strip: the match's road, centred in the HUD */
.rounds { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.rounds .eyebrow b { color: var(--sand); font-size: 13px; }
.strip { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; align-items: center; }
.node {
  width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--night);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; flex: none;
}
.node small { font-size: 9px; color: var(--dust); }
.node b { font-size: 13px; font-weight: 700; }
.node.win { border-color: var(--life); background: color-mix(in srgb, var(--life) 18%, var(--night)); }
.node.loss { border-color: var(--blood); background: color-mix(in srgb, var(--blood) 18%, var(--night)); }
.node.draw { border-color: var(--dust); }
.node.bye b { color: var(--dust); }
.node.now { border: 2px solid var(--bronze); width: 40px; height: 40px; }
.node.now b { color: var(--bronze); font-size: 16px; }
.node.now.live { animation: live 1s ease-in-out infinite alternate; }
@keyframes live { to { box-shadow: 0 0 0 3px color-mix(in srgb, var(--bronze) 35%, transparent); } }
.node.later { opacity: 0.45; border-style: dashed; }
.node.milestone { border-radius: 50%; width: 28px; height: 28px; }
.node.milestone b { color: var(--bronze); font-size: 12px; }
.node.milestone small { font-size: 8px; }
.node.milestone.done { border-color: var(--bronze); }
.node.milestone.now { width: 32px; height: 32px; }
.life { display: flex; flex-direction: column; gap: 3px; min-width: 130px; flex: 1; max-width: 230px; }
.life .top { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
.life .bar { height: 7px; background: var(--night); border-radius: 4px; overflow: hidden; }
.life .bar { height: 9px; position: relative; }
.life .bar i { display: block; height: 100%; background: var(--life); border-radius: 4px; transition: width 0.4s; }
/* One dash per 10 of the 60 HP */
.hp-dashes { position: relative; }
.hp-dashes::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to right, transparent 0 calc(100% / 6 - 1px), rgba(14, 12, 17, 0.9) calc(100% / 6 - 1px) calc(100% / 6));
}
.life.foe .bar i { background: var(--blood); }
.hud .tools { display: flex; gap: 6px; }

.stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr) 250px; }
.side { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.side.foe { border-right: 0; border-left: 1px solid var(--line); }
.side h2 { font-size: 24px; line-height: 1; }
.side .sub { color: var(--dust); font-size: 12px; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.prog { display: grid; grid-template-columns: 78px 1fr auto; gap: 8px; align-items: center; font-size: 12px; }
.pips { display: flex; gap: 2px; }
.pips i { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.pips i.f { background: var(--c); }
.pips i.mark { margin-right: 4px; }
.prog .next { color: var(--dust); white-space: nowrap; }
.stats-panel { display: flex; flex-direction: column; gap: 10px; }
.sg { display: flex; flex-direction: column; gap: 3px; }
.sg-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--sand); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.sr { display: grid; grid-template-columns: 96px 1fr 40px; gap: 6px; align-items: center; font-size: 12px; color: var(--dust); }
.sr.none { display: block; font-style: italic; }
.sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb { height: 6px; background: var(--night); border-radius: 3px; overflow: hidden; }
.sb i { display: block; height: 100%; border-radius: 3px; }
.sv { text-align: right; color: var(--sand); }

/* Card text: keywords and scaling numbers */
.kw { color: var(--c); font-weight: 600; }
.scale { text-decoration: underline; text-decoration-color: var(--bronze); text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 700; color: var(--sand); }
.tip {
  position: fixed; z-index: 50; max-width: 260px; pointer-events: none;
  background: #0e0c11; color: var(--sand); border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}
.tip-kind { color: var(--dust); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; }
.tip-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 2px 10px; margin-top: 4px; }
.tip-rows span { display: flex; justify-content: space-between; gap: 6px; color: var(--dust); }
.tip-rows span.cur { color: var(--bronze); }
.tip-rows b { color: var(--sand); }
.tip-rows .cur b { color: var(--bronze); }
.empty { color: var(--dust); font-size: 13px; font-style: italic; }

.arena-wrap { position: relative; min-height: 0; min-width: 0; }
#arena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.speed { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
.speed .btn { padding: 4px 9px; font-size: 13px; }
.preview {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); text-align: center; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  background: color-mix(in srgb, var(--night) 80%, transparent); border: 1px solid var(--line); border-radius: 10px; padding: 8px 20px 10px;
  max-width: calc(100% - 140px);
}
.countdown { display: flex; align-items: baseline; gap: 10px; font-family: var(--display); font-size: 26px; color: var(--sand); }
.countdown .timer { font-size: 58px; color: var(--bronze); }
.countdown .timer.urgent { color: var(--blood); animation: live 0.5s ease-in-out infinite alternate; }
.hp-note { font-size: 12px; color: var(--dust); }
.banner {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
  background: color-mix(in srgb, var(--night) 88%, transparent); border: 1px solid var(--line);
  border-radius: 10px; padding: 18px 26px; display: flex; flex-direction: column; gap: 8px; align-items: center;
  max-width: calc(100% - 32px);
}
.banner h2 { font-size: 48px; line-height: 1; }
.banner.win h2 { color: var(--bronze); }
.banner.loss h2 { color: var(--blood); }
.banner p { margin: 0; color: var(--dust); }

.tray {
  border-top: 1px solid var(--line); background: var(--pit);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 12px; align-items: stretch;
}
.purse { display: flex; flex-direction: column; gap: 5px; justify-content: center; width: 176px; flex: none; }
.eco { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--dust); }
.eco-line b { color: var(--bronze); font-size: 15px; }
.eco-bar { position: relative; height: 6px; background: var(--night); border-radius: 3px; }
.eco-bar i { display: block; height: 100%; background: var(--bronze); border-radius: 3px; }
.eco-bar em { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--sand); opacity: 0.7; }
.eco-sub { font-size: 11px; color: var(--sand); }
.eco-hint { font-size: 11px; }
.eco-hint.max { color: var(--bronze); }
.gold { display: flex; align-items: baseline; gap: 6px; }
.gold b { font-family: var(--display); font-size: 34px; font-weight: 400; color: var(--bronze); line-height: 1; }
.gold span { color: var(--dust); font-size: 12px; }
.purse .row { gap: 6px; }
.purse .btn { padding: 5px 9px; font-size: 13px; }
.cards { flex: 1; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 10px; min-width: 0; padding-bottom: 2px; }
.card {
  min-width: 0; text-align: left; background: var(--pit-2);
  border: 1px solid var(--line); border-top: 3px solid var(--tier); border-radius: 8px;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; position: relative;
}
.card:hover:not(:disabled) { border-color: var(--tier); transform: translateY(-2px); }
.card { transition: transform 0.12s, border-color 0.12s; }
.card:disabled { cursor: not-allowed; }
.card.poor .cost { color: var(--blood); }
.card.sold { visibility: hidden; }
.card { min-height: 142px; box-sizing: border-box; }
.card .top { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding-right: 26px; }
.card .cost {
  position: absolute; top: 6px; right: 8px; font-family: var(--display); font-size: 22px; line-height: 1; color: var(--tier);
}
/* Name, cost and tier label take the card's rarity color */
.card .nm { font-weight: 700; font-size: 15px; color: var(--tier); }
.card .ft .tier { color: var(--tier); font-weight: 700; }
.card .ds { font-size: 13px; color: var(--sand); opacity: 0.86; flex: 1; }
.card .ft { display: flex; justify-content: space-between; font-size: 11px; color: var(--dust); text-transform: uppercase; letter-spacing: 0.08em; }
.t-1 { --tier: #c4bbad; } .t-2 { --tier: #5fb3a1; } .t-3 { --tier: #7d8cf0; } .t-4 { --tier: #e0a43c; }
.t-hybrid { --tier: #d06bd0; } .t-counter { --tier: #b9b2a6; }
.go { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.go .btn.primary { font-family: var(--display); font-size: 24px; padding: 6px 22px; font-weight: 400; }
.hint { color: var(--dust); font-size: 11px; text-align: center; }

.modal-back { position: fixed; inset: 0; background: rgba(8, 6, 10, 0.72); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal {
  background: var(--pit); border: 1px solid var(--line); border-radius: 10px; padding: 20px; max-width: 760px; width: 100%;
  max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
}
.modal h2 { font-size: 34px; }
.sig-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.sig { text-align: left; background: var(--pit-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.sig:hover { border-color: var(--bronze); }
.sig b { font-family: var(--display); font-size: 24px; font-weight: 400; color: var(--bronze); }

.toast {
  position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--pit-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 6px; z-index: 30; font-size: 14px;
}

.mobile-tabs { display: none; }

@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 1fr) auto; }
  .side { display: none; border: 0; border-top: 1px solid var(--line); max-height: 34vh; }
  .side.foe { border-left: 0; }
  .arena-wrap { order: -1; }
  .side.show { display: flex; }
  .mobile-tabs { display: flex; gap: 6px; padding: 6px 16px 0; }
  .mobile-tabs .btn { padding: 4px 10px; font-size: 13px; }
  .hud { gap: 10px 14px; }
  .hud .vs { order: 10; flex-basis: 100%; min-width: 0; justify-content: flex-start; flex-wrap: nowrap; }
  .life { min-width: 0; max-width: none; }
  .life .top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hud .tools { margin-left: auto; }
  .tray { flex-wrap: wrap; }
  .purse { flex-direction: row; align-items: center; min-width: 0; flex: 1; gap: 12px; }
  .cards { order: 3; flex-basis: 100%; display: flex; overflow-x: auto; }
  .card { flex: 0 0 150px; }
  .purse { width: auto; }
  .eco { min-width: 130px; flex: 1; }
  .rounds { order: 9; flex-basis: 100%; overflow-x: auto; align-items: flex-start; }
  .preview { left: 8px; top: 8px; bottom: auto; transform: none; max-width: calc(100% - 150px); padding: 4px 10px 6px; align-items: flex-start; text-align: left; }
  .preview .eyebrow { font-size: 9px; }
  .countdown { font-size: 18px; gap: 6px; white-space: nowrap; }
  .countdown .timer { font-size: 34px; }
  .hp-note { font-size: 11px; }
  .go { flex-direction: row; align-items: center; }
  .hint { display: none; }
  .slot { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .slot .seg { grid-column: 1 / -1; order: 5; }
  .slot.room { grid-template-columns: 22px minmax(0, 1fr); }
  .slot-ctl { grid-column: 1 / -1; justify-content: flex-start; order: 6; }
}

@media (prefers-reduced-motion: reduce) {
  .card, .life .bar i { transition: none; }
}
.shroud-name { color: var(--dust); letter-spacing: 6px; }
.progress.shroud .prog { opacity: 0.35; }
.life.shrouded { opacity: 0.6; }

</style>

// ---- src/rng.js
// Seeded PRNG (mulberry32). Every random roll in a match goes through one of
// these so fights replay identically from a seed.
function makeRng(seed) {
  let s = seed >>> 0;
  const rng = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  rng.int = (n) => Math.floor(rng() * n);
  rng.pick = (arr) => arr[Math.floor(rng() * arr.length)];
  rng.state = () => s;
  return rng;
}

function weightedPick(rng, items, weightOf) {
  let total = 0;
  for (const it of items) total += weightOf(it);
  if (total <= 0) return null;
  let r = rng() * total;
  for (const it of items) {
    r -= weightOf(it);
    if (r <= 0) return it;
  }
  return items[items.length - 1];
}

function unlockedTier(count) {
  let tier = 1;
  for (const t of [2, 3, 4]) if (count >= TIER_UNLOCK[t]) tier = t;
  return tier;
}

    innate: { desc: 'Gains 4.5% Focus each time she is hit. Dodges apply 4 Toxin.', onEvade: (f, u) => f.apply(u, 'poison', 4) },
    ability: { name: 'Smoke Veil', desc: (u) => `Gain 25% Focus and 30 Shield + 1 per Toxin on the enemy (${Math.round(30 + (u?.enemy?.poison ?? 0))}), and apply 6 Toxin plus 1 per 5 already on them.`,
      cast: (f, u, p) => { f.gain(u, 'focus', 0.25); f.gain(u, 'shield', (30 + u.enemy.poison) * p); f.apply(u, 'poison', Math.round((6 + u.enemy.poison / 5) * p)); } },
    signatures: [
      { id: 'shade_needles', name: 'Needle Rain', desc: 'Dodges apply 4 more Toxin.', onEvade: (f, u) => f.apply(u, 'poison', 4) },
      { id: 'shade_veil', name: 'Thick Smoke', desc: 'Start each fight with 30% Focus.', setup: (u) => { u.focusStart += 0.3; } },
    ],
  },
];

const CHAR_BY_ID = Object.fromEntries(CHARACTERS.map((c) => [c.id, c]));

// Visibility after bans. Returns 'hidden', 'weakened' or 'ok'.
function characterStatus(char, bans) {
  const left = char.resources.filter((r) => !bans.includes(r));
  if (left.length === 0) return 'hidden';
  if (left.length < char.resources.length) return 'weakened';
  return 'ok';
}

// ---- src/engine/combat.js

const DT = 0.05;
// Overtime, so every fight ends with a death (TFT-style):
//   from 30s  all damage +8% per second, healing and shield gains -3% per
//             second (gone entirely at about 63s)
//   from 60s  the arena burns both fighters for unblockable damage that grows
//             every second
const SUDDEN_DEATH_AT = 30;
const BURN_AT = 60;
const TIME_LIMIT = 180; // safety net only; the burn ends fights long before
function overtime(t) {
  const over = Math.max(0, t - SUDDEN_DEATH_AT);
  return { damage: 1 + over * 0.08, healing: Math.max(0, 1 - over * 0.03), burn: Math.max(0, t - BURN_AT) * 0.005 };
}
// Fighters get tougher every round so late-game damage doesn't end fights in
// a hit or two. Fitted so fights last about as long in round 14 as in round 1.
function hpScale(round = 1) {
  return 1 + 0.015 * (Math.max(1, round) - 1) ** 2;
}
const DEFAULT_SOURCE = { attack: 'Attacks', poison: 'Toxin', bleed: 'Bleed', thorns: 'Thorns', true: 'Other' };

const HOOKS = ['onStart', 'onAttack', 'onHit', 'onCrit', 'onEvade', 'onPain', 'onHeal', 'onCast', 'onFreeze', 'onBolt', 'onHitTaken', 'onShieldBreak', 'bonusDamage'];
// Healing this share of base max HP counts as one "On heal".
const HEAL_STEP = 0.05;
// Max HP each Health (pain) card gives.
const HEALTH_PER_CARD = 5;
// Each freeze you suffer needs this much more Frost than the last one.
const FREEZE_STEP = 10;
// Grit: losing GRIT_AT of max HP within GRIT_WINDOW seconds halves the damage
// you take for GRIT_DUR seconds, at most once every GRIT_CD seconds.
const GRIT = { at: 0.3, window: 2, dur: 1.5, cut: 0.5, cd: 6 };
// Lightning: this many stacks call a bolt.
const BOLT_AT = 10;
const BASE = { hp: 600, ad: 30, as: 1.0, crit: 0.05, critMult: 1.75, manaMax: 100, manaPerAttack: 10, focusGain: 0 };

// Build a combat unit from a loadout: { charId, cards: {id: copies}, sig, round }.
function buildUnit(loadout, side) {
  const ch = CHAR_BY_ID[loadout.charId];
  const s = { ...BASE, ...ch.stats };
  const u = {
    side, char: ch, sig: loadout.sig || null,
    maxHp: s.hp, hp: 0, ad: s.ad, asBase: s.as, asBonus: 0, crit: s.crit, critMult: s.critMult,
    manaMax: s.manaMax, mana: 0, manaStart: 0, manaPerAttack: s.manaPerAttack, manaRegen: 0,
    // stacks on self
    fire: 0, fireCap: 25, fireStart: 0, fireIdle: 0, fireLinger: 3,
    shield: 0, regen: 0, arcane: 0, arcaneValue: 0.04, armor: 0,
    lightning: 0, boltAt: BOLT_AT, bolts: 0, galv: 0,
    // stacks the enemy put on you
    frost: 0, poison: 0, bleed: 0,
    // freeze settings you impose on the enemy
    freezeAt: 16, freezeDur: 1.5, freezesDone: 0, freezeImmune: 0, freezesTaken: 0,
    // grit
    recent: [], grit: 0, gritCd: 0, gritAt: GRIT.at, gritCut: GRIT.cut,
    // evasion
    focus: 0, focusGain: s.focusGain, focusCap: 0.6, focusReset: 0, focusStart: 0,
    // pain
    painStep: 0.12, painAcc: 0, healAcc: 0,
    // timers and counters
    frozen: 0, immune: 0, bastionCd: 0, attackTimer: 0, attackCount: 0, castCount: 0, forceCrit: 0,
    momentumCap: 0, pendingAttacks: 0, bleedApplied: 0,
    m: {
      poisonDmg: 1, bleedDmg: 1, bleedDecay: 1, frostDecay: 1, shieldGain: 1, shieldCap: 1, vsShield: 1,
      poisonTaken: 1, frostTaken: 1, bleedTaken: 1, abilityTaken: 1, enemyHealCut: 0, enemyFireCapCut: 0,
      abilityPower: 1, castCost: 1, frozenBonus: 0, reflect: 0, manaWard: 0, armorPierce: 0,
      focusDrain: 0, trueSight: 0, critMissing: 0, castRefund: 0, berserk: 0, bleedLeech: 0,
      pandemic: 0, secondWind: 0, healGain: 1, boltDmg: 1, boltTaken: 1,
    },
    flags: {},
    used: {},
    hooks: Object.fromEntries(HOOKS.map((h) => [h, []])),
    timers: [],
    stats: { dealt: 0, taken: 0, healed: 0, dodges: 0, crits: 0, casts: 0, freezes: 0, bolts: 0, byKind: {}, dmg: {}, heal: {}, mit: {} },
    tagCounts: {},
  };

  const sources = [];
  sources.push({ src: ch.innate, n: 1, name: 'innate' });
  for (const [id, n] of Object.entries(loadout.cards || {})) {
    const card = CARD_BY_ID[id];
    if (card && n > 0) {
      sources.push({ src: card, n, name: card.name });
      for (const t of card.tags) u.tagCounts[t] = (u.tagCounts[t] || 0) + n;
    }
  }
  if (u.sig) {
    const sig = ch.signatures.find((x) => x.id === u.sig);
    if (sig) sources.push({ src: sig, n: 1, name: sig.name });
  }

  // Trigger tag passives: owning cards of a trigger makes that trigger happen.
  const tc = u.tagCounts;
  u.asBonus += 0.01 * (tc.strike || 0);
  u.crit += 0.01 * (tc.precision || 0);
  u.focusGain += 0.03 * (tc.evasion || 0);
  u.painStep -= 0.005 * (tc.pain || 0);
  u.maxHp += HEALTH_PER_CARD * (tc.pain || 0);
  u.manaPerAttack += 0.5 * (tc.spell || 0);

  for (const { src, n } of sources) {
    if (src.setup) src.setup(u, n);
    for (const h of HOOKS) if (src[h]) u.hooks[h].push({ fn: src[h], n });
    if (src.every) u.timers.push({ interval: src.every[0], fn: src.every[1], n, acc: 0 });
  }

  if (u.flags.titan) { u.maxHp *= 1.6; u.asBase *= 0.8; u.hooks.bonusDamage.push({ fn: (f, x) => x.baseHp * 0.03, n: 1 }); }
  if (u.flags.bullseye) u.crit *= 2;
  if (u.flags.tempest) u.boltAt = Math.max(3, Math.round(u.boltAt / 2));
  u.crit = Math.min(u.crit, 0.95);
  // Effects worth "x% of max HP" (bleed, regen, shields...) use baseHp, the
  // HP before round scaling, so they don't grow faster than everything else.
  u.baseHp = u.maxHp;
  u.maxHp = Math.round(u.maxHp * hpScale(loadout.round));
  u.hp = u.maxHp;
  return u;
}

class Fight {
  constructor(loadoutA, loadoutB, seed = 1) {
    this.rng = makeRng(seed);
    this.a = buildUnit(loadoutA, 0);
    this.b = buildUnit(loadoutB, 1);
    this.a.enemy = this.b;
    this.b.enemy = this.a;
    this.units = [this.a, this.b];
    this.t = 0;
    this.over = false;
    this.winner = null; // 0, 1, or -1 for a draw
    this.onEvent = null; // set by the renderer to receive hit/dodge/cast events
    for (const u of this.units) {
      u.fireCap = Math.max(5, u.fireCap - u.enemy.m.enemyFireCapCut);
      u.mana = Math.min(u.manaMax * 0.9, u.manaStart);
      u.focus = Math.min(u.focusCap, u.focusStart);
      if (u.fireStart) this.gain(u, 'fire', u.fireStart);
    }
    for (const u of this.units) this.run(u, 'onStart');
  }

  emit(type, u, data = {}) {
    if (this.onEvent) this.onEvent({ t: this.t, type, side: u.side, ...data });
  }

  run(u, hook, arg) {
    for (const h of u.hooks[hook]) h.fn(this, u, h.n, arg);
  }

  // Stacks on yourself.
  gain(u, res, k) {
    if (u.dead || !(k > 0)) return;
    switch (res) {
      // Fire melts the Frost on you, stack for stack.
      case 'fire': u.fire = Math.min(u.fireCap, u.fire + k); u.fireIdle = 0; u.frost = Math.max(0, u.frost - k); break;
      case 'shield': u.shield = Math.min(u.maxHp * u.m.shieldCap, u.shield + k * u.m.shieldGain * overtime(this.t).healing); break;
      case 'regen': u.regen += k; break;
      case 'arcane': u.arcane += k; break;
      case 'armor': u.armor += k; break;
      case 'focus': u.focus = Math.min(u.focusCap, u.focus + k); break;
      case 'lightning':
        u.lightning += k;
        while (u.lightning >= u.boltAt && !u.dead && !u.enemy.dead) { u.lightning -= u.boltAt; this.bolt(u); }
        break;
    }
  }

  // Stacks you put on the enemy.
  apply(src, res, k) {
    const tgt = src.enemy;
    if (tgt.dead || !(k > 0)) return;
    if (res === 'frost') {
      tgt.frost += k * Math.max(0, tgt.m.frostTaken);
      if (tgt.frost >= this.freezePoint(src, tgt)) this.freeze(src, tgt);
    } else if (res === 'poison') {
      tgt.poison += k;
      if (src.m.pandemic && tgt.poison >= 40) {
        this.damage(src, tgt, tgt.poison * src.m.pandemic, 'poison', { source: 'Pandemic' });
        tgt.poison = Math.floor(tgt.poison / 2);
        this.emit('burst', tgt);
      }
    } else if (res === 'bleed') {
      tgt.bleed += k;
      if (src.flags.septic) this.apply(src, 'poison', k / 2);
      if (src.flags.bloodRite) {
        src.bleedApplied += k;
        while (src.bleedApplied >= 8) { src.bleedApplied -= 8; this.gain(src, 'regen', 1); }
      }
    }
  }

  // Frost needed to freeze tgt: rises by FREEZE_STEP with every freeze it suffered.
  freezePoint(src, tgt) {
    return Math.max(6, src.freezeAt) + FREEZE_STEP * tgt.freezesTaken;
  }

  freeze(src, tgt) {
    tgt.frost = 0;
    if (tgt.freezeImmune > 0) { tgt.freezeImmune--; this.emit('resist', tgt); return; }
    tgt.freezesTaken++;
    src.freezesDone++;
    src.flags.bigFreeze = src.flags.absoluteZero && src.freezesDone % 3 === 0;
    tgt.frozen = src.flags.bigFreeze ? 4 : src.freezeDur;
    src.stats.freezes++;
    this.emit('freeze', tgt, { dur: tgt.frozen });
    this.run(src, 'onFreeze');
    src.flags.bigFreeze = false;
  }

  // A Lightning bolt: ability damage that grows with every bolt this fight
  // and knocks the enemy's next swing back to the start.
  bolt(u) {
    const e = u.enemy;
    const d = this.boltDamage(u) * Math.max(0, e.m.boltTaken);
    u.bolts++;
    u.stats.bolts++;
    this.emit('bolt', e);
    this.damage(u, e, d, 'ability', { source: 'Lightning' });
    e.attackTimer = 0;
    this.run(u, 'onBolt');
  }

  boltDamage(u) {
    const frozen = u.flags.superconductor && u.enemy.frozen > 0 ? 1.5 : 1;
    return (40 + 4 * Math.min(20, u.bolts)) * u.m.boltDmg * frozen;
  }

  antiheal(u) {
    return Math.min(0.9, u.enemy.m.enemyHealCut);
  }

  // Per-source tallies for the stats panel. `mit` is damage prevented.
  tally(u, table, source, amt) {
    if (amt > 0) u.stats[table][source] = (u.stats[table][source] || 0) + amt;
  }

  heal(u, amt, source = 'Other') {
    if (u.dead || amt <= 0) return 0;
    amt *= u.m.healGain * Math.max(0, 1 - this.antiheal(u)) * overtime(this.t).healing;
    const room = u.maxHp - u.hp;
    const healed = Math.min(room, amt);
    u.hp += healed;
    if (u.flags.overhealShield && amt > healed) this.gain(u, 'shield', amt - healed);
    u.stats.healed += healed;
    this.tally(u, 'heal', source, healed);
    u.healAcc += healed;
    let guard = 0;
    while (u.healAcc >= HEAL_STEP * u.baseHp && guard++ < 10 && !u.dead) {
      u.healAcc -= HEAL_STEP * u.baseHp;
      this.run(u, 'onHeal');
    }
    return healed;
  }

  // kind: attack | ability | poison | bleed | thorns | true
  // info.source names the damage in the stats panel (defaults by kind).
  damage(src, tgt, amt, kind, info = {}) {
    if (tgt.dead || !(amt > 0)) return 0;
    const source = info.source || DEFAULT_SOURCE[kind] || src.char.ability.name;
    amt *= overtime(this.t).damage;
    if (tgt.immune > 0) { this.tally(tgt, 'mit', 'Immunity', amt); return 0; }
    if (tgt.frozen > 0 && src.m.frozenBonus && (kind === 'attack' || kind === 'ability')) amt *= 1 + src.m.frozenBonus;
    let before = amt;
    if (kind === 'attack' || kind === 'thorns') {
      const armor = 1.25 * Math.max(0, tgt.armor + (tgt.flags.moltenArmor ? Math.floor(tgt.fire / 5) : 0) - src.m.armorPierce);
      amt = Math.max(amt * 0.25, amt - armor);
      this.tally(tgt, 'mit', 'Armor', before - amt);
    }
    before = amt;
    if (kind === 'ability') amt *= Math.max(0, tgt.m.abilityTaken);
    if (kind === 'poison') amt *= Math.max(0, tgt.m.poisonTaken);
    if (kind === 'bleed') amt *= Math.max(0, tgt.m.bleedTaken);
    this.tally(tgt, 'mit', 'Resistances', before - amt);
    if (tgt.flags.livingMountain && (kind === 'attack' || kind === 'ability')) {
      before = amt;
      amt = Math.min(amt, tgt.maxHp * 0.06);
      this.tally(tgt, 'mit', 'Living Mountain', before - amt);
    }

    // Toxin goes through Armor (above) but not Shield.
    if (kind !== 'true' && tgt.shield > 0) {
      const eff = amt * src.m.vsShield;
      const absorbed = Math.min(tgt.shield, eff);
      tgt.shield -= absorbed;
      amt = (eff - absorbed) / src.m.vsShield;
      this.tally(tgt, 'mit', 'Shield', absorbed / src.m.vsShield);
      if (tgt.m.reflect && kind === 'attack') this.damage(tgt, src, absorbed * tgt.m.reflect, 'true', { source: 'Reflective Plating' });
      if (tgt.shield <= 0.01) {
        tgt.shield = 0;
        this.run(tgt, 'onShieldBreak');
        if (tgt.flags.bastion && tgt.bastionCd <= 0) {
          tgt.immune = 1; tgt.bastionCd = 6; this.emit('immune', tgt);
          return absorbed;
        }
      }
    }
    if (tgt.m.manaWard && kind === 'attack' && tgt.arcane >= 5) {
      this.tally(tgt, 'mit', 'Mana Shield', amt * tgt.m.manaWard);
      amt *= 1 - tgt.m.manaWard;
    }
    if (tgt.grit > 0 && source !== 'Arena burn') {
      this.tally(tgt, 'mit', 'Grit', amt * tgt.gritCut);
      amt *= 1 - tgt.gritCut;
    }
    if (amt <= 0) return 0;

    tgt.hp -= amt;
    if (source !== 'Arena burn') this.checkGrit(tgt, amt);
    src.stats.dealt += amt;
    this.tally(src, 'dmg', source, amt);
    src.stats.byKind[kind] = (src.stats.byKind[kind] || 0) + amt;
    tgt.stats.taken += amt;
    if (kind === 'attack' || kind === 'ability' || kind === 'thorns') this.emit('dmg', tgt, { amt, kind, crit: !!info.crit });

    // Pain triggers
    tgt.painAcc += amt;
    const step = Math.max(0.04, tgt.painStep) * tgt.maxHp;
    let guard = 0;
    while (tgt.painAcc >= step && guard++ < 10 && tgt.hp > 0) {
      tgt.painAcc -= step;
      this.run(tgt, 'onPain');
    }
    if (tgt.m.secondWind && !tgt.used.secondWind && tgt.hp < tgt.maxHp * 0.5) {
      tgt.used.secondWind = true;
      this.gain(tgt, 'regen', tgt.m.secondWind);
    }
    if (tgt.flags.lastStand && !tgt.used.lastStand && tgt.hp > 0 && tgt.hp < tgt.maxHp * 0.3) {
      tgt.used.lastStand = true;
      for (let i = 0; i < 5; i++) this.run(tgt, 'onPain');
      tgt.immune = 1;
      this.emit('immune', tgt);
    }
    if (tgt.hp <= 0) {
      if (tgt.flags.phoenix && !tgt.used.phoenix) {
        tgt.used.phoenix = true;
        tgt.hp = tgt.maxHp * Math.max(0.1, Math.min(1, tgt.fire * 0.02));
        this.tally(tgt, 'heal', 'Phoenix Core', tgt.hp);
        tgt.fire = 0;
        tgt.poison = Math.floor(tgt.poison / 2);
        tgt.bleed = 0;
        tgt.immune = 0.5;
        this.emit('revive', tgt);
      } else {
        tgt.hp = 0;
        tgt.dead = true;
      }
    }
    return amt;
  }

  // Grit: a burst of damage in a short window makes you tougher for a moment.
  checkGrit(u, amt) {
    u.recent.push([this.t, amt]);
    while (u.recent.length && u.recent[0][0] < this.t - GRIT.window) u.recent.shift();
    if (u.grit > 0 || u.gritCd > 0 || u.hp <= 0) return;
    let sum = 0;
    for (const [, a] of u.recent) sum += a;
    if (sum >= u.gritAt * u.maxHp) {
      u.grit = GRIT.dur; u.gritCd = GRIT.cd; u.recent = [];
      this.emit('grit', u);
    }
  }

  attackSpeed(u) {
    let as = u.asBase * (1 + u.asBonus + u.galv + 0.025 * u.fire + Math.min(u.momentumCap, 0.01 * u.attackCount));
    if (u.m.berserk) as *= 1 + u.m.berserk * (1 - u.hp / u.maxHp);
    return as * this.slow(u);
  }

  slow(u) {
    return Math.max(0.3, 1 - 0.015 * u.frost);
  }

  queueExtraAttack(u) {
    u.pendingAttacks++;
  }

  attack(a, extra = false) {
    const d = a.enemy;
    if (a.dead || d.dead) return;
    a.attackCount++;
    this.run(a, 'onAttack', { extra });
    if (a.flags.whirlwind) this.run(a, 'onAttack', { extra: true });
    if (d.dead) return;

    const canDodge = (d.focusGain > 0 || d.focus > 0) && !(a.m.trueSight && a.attackCount % a.m.trueSight === 0);
    if (canDodge && this.rng() < d.focus) {
      d.focus = d.focusReset;
      d.stats.dodges++;
      this.tally(d, 'mit', 'Dodge', a.ad);
      this.emit('dodge', d);
      this.run(d, 'onEvade');
      return;
    }
    if (d.focusGain > 0) d.focus = Math.min(d.focusCap, d.focus + d.focusGain);
    if (a.m.focusDrain) d.focus *= 1 - Math.min(1, a.m.focusDrain);

    let crit = false;
    if (a.forceCrit > 0) { crit = true; a.forceCrit--; } else crit = this.rng() < a.crit;
    let dmg = a.ad;
    for (const h of a.hooks.bonusDamage) dmg += h.fn(this, a, h.n) || 0;
    if (crit) {
      dmg *= a.critMult;
      if (a.m.critMissing) dmg += (d.maxHp - d.hp) * a.m.critMissing;
      a.stats.crits++;
    }
    const dealt = this.damage(a, d, dmg, 'attack', { crit });
    const hit = { crit, dmg: dealt };
    this.emit('attack', a, { crit });
    this.run(a, 'onHit', hit);
    if (crit) this.run(a, 'onCrit', hit);
    if (!d.dead) this.run(d, 'onHitTaken', a);
  }

  cast(u) {
    u.castCount++;
    u.stats.casts++;
    const power = u.m.abilityPower * (1 + u.arcane * u.arcaneValue + (u.flags.spellfire ? u.fire * 0.01 : 0));
    this.emit('cast', u, { name: u.char.ability.name });
    u.char.ability.cast(this, u, power);
    if (u.flags.spellEcho && u.castCount % 3 === 0) u.char.ability.cast(this, u, power * 0.5);
    this.run(u, 'onCast');
    if (u.m.castRefund) u.mana += u.manaMax * u.m.castRefund;
  }

  step(dt = DT) {
    if (this.over) return;
    this.t += dt;
    for (const u of this.units) {
      if (u.dead) continue;
      const e = u.enemy;
      u.frozen = Math.max(0, u.frozen - dt);
      u.immune = Math.max(0, u.immune - dt);
      u.bastionCd = Math.max(0, u.bastionCd - dt);
      u.grit = Math.max(0, u.grit - dt);
      u.gritCd = Math.max(0, u.gritCd - dt);

      // Damage over time the enemy put on this unit.
      if (u.poison > 0) {
        let mult = e.m.poisonDmg * (e.flags.plague ? 1.5 : 1);
        if (e.flags.toxicFrost && (u.frost >= 5 || u.frozen > 0)) mult *= 1.6;
        const d = this.damage(e, u, u.poison * mult * dt, 'poison');
        if (e.flags.plague) this.heal(e, d * 0.2, 'Plague Lord');
        // Poison wears off slowly, so it levels off instead of growing forever.
        u.poison = Math.max(0, u.poison - u.poison * 0.02 * dt);
      }
      if (u.bleed > 0.05 && !u.dead) {
        const d = this.damage(e, u, u.bleed * 0.0025 * u.baseHp * e.m.bleedDmg * dt, 'bleed');
        if (e.m.bleedLeech) this.heal(e, d * e.m.bleedLeech, 'Bleed lifesteal');
        u.bleed = Math.max(0, u.bleed - u.bleed * 0.08 * e.m.bleedDecay * dt);
      }
      if (u.dead) continue;
      u.frost = Math.max(0, u.frost - 0.6 * e.m.frostDecay * dt);

      if (u.regen > 0) this.heal(u, u.regen * 0.002 * u.baseHp * dt, 'Regen');
      const burn = overtime(this.t).burn;
      if (burn > 0) this.damage(e, u, u.maxHp * burn * dt, 'true', { source: 'Arena burn' });
      if (u.dead) continue;
      u.fireIdle += dt;
      if (u.fireIdle > u.fireLinger) u.fire = Math.max(0, u.fire - 2.5 * dt);

      for (const tm of u.timers) {
        tm.acc += dt;
        if (tm.acc >= tm.interval) { tm.acc -= tm.interval; tm.fn(this, u, tm.n); }
      }

      if (u.frozen <= 0) {
        // Mana fills smoothly: mana per attack times attacks per second.
        const as = this.attackSpeed(u);
        u.mana += (u.manaRegen * this.slow(u) + u.manaPerAttack * as) * dt;
        u.attackTimer += as * dt;
        let guard = 0;
        while (u.attackTimer >= 1 && guard++ < 4 && !u.dead && !e.dead) {
          u.attackTimer -= 1;
          this.attack(u);
        }
        while (u.pendingAttacks > 0 && !u.dead && !e.dead) {
          u.pendingAttacks--;
          this.attack(u, true);
        }
        const cost = u.manaMax * u.m.castCost;
        if (u.mana >= cost && !u.dead && !e.dead) {
          u.mana -= cost;
          this.cast(u);
          while (u.pendingAttacks > 0 && !u.dead && !e.dead) { u.pendingAttacks--; this.attack(u, true); }
        }
      }
      u.mana = Math.min(u.mana, u.manaMax * 1.5);
    }
    this.checkEnd();
  }

  checkEnd() {
    const [a, b] = this.units;
    if (a.dead || b.dead) {
      this.over = true;
      this.winner = a.dead && b.dead ? -1 : a.dead ? 1 : 0;
    } else if (this.t >= TIME_LIMIT) {
      this.over = true;
      const pa = a.hp / a.maxHp, pb = b.hp / b.maxHp;
      this.winner = Math.abs(pa - pb) < 0.01 ? -1 : pa > pb ? 0 : 1;
    }
  }

  runToEnd() {
    while (!this.over) this.step();
    return this.result();
  }

  result() {
    const w = this.winner;
    const survivor = w >= 0 ? this.units[w] : null;
    return {
      winner: w,
      time: this.t,
      survivorHpPct: survivor ? survivor.hp / survivor.maxHp : 0,
      stats: this.units.map((u) => ({ ...u.stats })),
    };
  }
}

// ---- src/engine/shop.js

const SHOP_SIZE = 5;
const REROLL_COST = 1;
const BASE_WEIGHT = { 1: 10, 2: 7, 3: 5, 4: 3, hybrid: 6, counter: 2.5 };

function tagCounts(cards) {
  const counts = {};
  for (const [id, n] of Object.entries(cards)) {
    const c = CARD_BY_ID[id];
    if (!c) continue;
    for (const t of c.tags) counts[t] = (counts[t] || 0) + n;
  }
  return counts;
}

function cardCost(card) {
  return CARD_COST[card.tier];
}

function isBanned(card, bans) {
  if (cardResources(card).some((r) => bans.includes(r))) return true;
  if (card.counters && bans.includes(card.counters)) return true;
  return false;
}

// Why a card is (or isn't) in your pool. Used by the UI for tier progress.
function isUnlocked(card, counts, round) {
  if (card.tier === 1) return true;
  if (card.tier === 'counter') return round >= 2;
  if (card.tier === 'hybrid') return card.tags.every((t) => (counts[t] || 0) >= HYBRID_REQ);
  const best = Math.max(0, ...card.tags.map((t) => counts[t] || 0));
  return best >= TIER_UNLOCK[card.tier];
}

function eligibleCards(player, bans, round) {
  const counts = tagCounts(player.cards);
  return CARDS.filter((c) => !isBanned(c, bans) && (player.cards[c.id] || 0) < c.max && isUnlocked(c, counts, round));
}

function cardWeight(card, player, counts) {
  let w = BASE_WEIGHT[card.tier];
  if (card.tags.length) {
    const avg = card.tags.reduce((s, t) => s + (counts[t] || 0), 0) / card.tags.length;
    w *= Math.min(3, 1 + 0.15 * avg);
  }
  const ch = CHAR_BY_ID[player.charId];
  if (ch && card.tags.some((t) => t === ch.trigger || ch.resources.includes(t))) w *= 1.5;
  return w;
}

function rollShop(player, bans, round, rng) {
  const counts = tagCounts(player.cards);
  const pool = eligibleCards(player, bans, round);
  const shop = [];
  while (shop.length < SHOP_SIZE && pool.length) {
    const pick = weightedPick(rng, pool, (c) => cardWeight(c, player, counts));
    if (!pick) break;
    shop.push(pick.id);
    pool.splice(pool.indexOf(pick), 1);
  }
  return shop;
}

// ---- src/engine/match.js

const START_HP = 60;
const START_GOLD = 6; // on top of round 1's income
const SIGNATURE_ROUND = 7;
const BAN_COUNT = 2; // resources banned per match, by vote
const MAX_PLAYERS = 8;

// Match state is plain JSON so it can be saved, snapshotted or sent over a
// network later. Players are an array so more than two can be added.
function createMatch({ seed = Date.now() % 1e9, players }) {
  return {
    seed, nonce: 0, round: 0, phase: 'ban', bans: [], history: [], pairs: [],
    players: players.map((p, i) => ({
      id: i, name: p.name, isBot: !!p.isBot, level: p.level || null, charId: null, hp: START_HP, gold: START_GOLD,
      cards: {}, shop: [], locked: false, sig: null, ban: null, wins: 0, placement: null, lastOpp: null,
    })),
  };
}

function rngFor(m) {
  m.nonce++;
  return makeRng((m.seed * 7919 + m.nonce * 104729) >>> 0);
}

function visibleCharacters(bans) {
  return CHARACTERS.map((c) => ({ char: c, status: characterStatus(c, bans) })).filter((x) => x.status !== 'hidden');
}

// Everyone votes to ban one resource; the BAN_COUNT most-voted are banned,
// ties broken at random. In 1v1 that is simply both players' picks.
function submitBan(m, playerId, resource) {
  m.players[playerId].ban = resource;
  if (m.players.every((p) => p.ban)) {
    const rng = rngFor(m);
    const votes = {};
    for (const p of m.players) votes[p.ban] = (votes[p.ban] || 0) + 1;
    m.banVotes = votes;
    m.bans = Object.keys(votes)
      .map((r) => ({ r, v: votes[r], tie: rng() }))
      .sort((a, b) => b.v - a.v || a.tie - b.tie)
      .slice(0, BAN_COUNT)
      .map((x) => x.r);
    m.phase = 'pick';
  }
}

function pickCharacter(m, playerId, charId) {
  const ch = CHAR_BY_ID[charId];
  if (!ch || characterStatus(ch, m.bans) === 'hidden') return false;
  m.players[playerId].charId = charId;
  if (m.players.every((p) => p.charId)) startRound(m);
  return true;
}

function income(round) {
  return Math.min(10, 4 + round);
}

// Interest: +1 gold per INTEREST_STEP kept at the start of a round, up to INTEREST_MAX.
const INTEREST_STEP = 5;
const INTEREST_MAX = 3;
function interest(gold) {
  return Math.min(INTEREST_MAX, Math.floor(gold / INTEREST_STEP));
}

function startRound(m) {
  m.round++;
  for (const p of alive(m)) {
    p.gold += income(m.round) + interest(p.gold);
    if (!p.locked || p.shop.length === 0) p.shop = rollShop(p, m.bans, m.round, rngFor(m));
    p.locked = false;
  }
  m.pairs = pairings(m);
  m.phase = m.round === SIGNATURE_ROUND ? 'signature' : 'shop';
}

// This round's opponent: { id, ghost } or null.
function opponentOf(m, id) {
  for (const [a, b, ghost] of m.pairs) {
    if (a === id) return { id: b, ghost: !!ghost };
    if (b === id && !ghost) return { id: a, ghost: false };
  }
  return null;
}

function chooseSignature(m, playerId, sigId) {
  m.players[playerId].sig = sigId;
  if (alive(m).every((p) => p.sig)) m.phase = 'shop';
}

function alive(m) {
  return m.players.filter((p) => p.hp > 0);
}

function buy(m, playerId, slot) {
  const p = m.players[playerId];
  const id = p.shop[slot];
  const card = id && CARD_BY_ID[id];
  if (!card) return false;
  const cost = cardCost(card);
  if (p.gold < cost || (p.cards[id] || 0) >= card.max) return false;
  p.gold -= cost;
  p.cards[id] = (p.cards[id] || 0) + 1;
  p.shop[slot] = null;
  return true;
}

function reroll(m, playerId) {
  const p = m.players[playerId];
  if (p.gold < REROLL_COST) return false;
  p.gold -= REROLL_COST;
  p.shop = rollShop(p, m.bans, m.round, rngFor(m));
  p.locked = false;
  return true;
}

function toggleLock(m, playerId) {
  m.players[playerId].locked = !m.players[playerId].locked;
}

// round sets the fighters' HP scaling (see hpScale in combat.js).
function loadout(p, round = 1) {
  return { charId: p.charId, cards: { ...p.cards }, sig: p.sig, round };
}

// Random pairings each round, avoiding last round's opponent where possible.
// With an odd number alive, the player left over fights a "ghost": a copy of
// another living player's build. Losing to a ghost costs HP; beating one
// doesn't hurt the player it copies.
function pairings(m) {
  const live = alive(m).map((p) => p.id);
  if (live.length < 2) return [];
  const rng = rngFor(m);
  let best = null, bestRepeats = Infinity;
  for (let attempt = 0; attempt < 12 && bestRepeats > 0; attempt++) {
    const order = live.slice();
    for (let i = order.length - 1; i > 0; i--) { const j = rng.int(i + 1); [order[i], order[j]] = [order[j], order[i]]; }
    const pairs = [];
    for (let i = 0; i + 1 < order.length; i += 2) pairs.push([order[i], order[i + 1]]);
    if (order.length % 2) {
      const odd = order[order.length - 1];
      const others = live.filter((x) => x !== odd);
      pairs.push([odd, others[rng.int(others.length)], 'ghost']);
    }
    const repeats = live.length > 2 ? pairs.filter(([a, b]) => m.players[a].lastOpp === b).length : 0;
    if (repeats < bestRepeats) { best = pairs; bestRepeats = repeats; }
  }
  return best;
}

function makeFight(m, a, b) {
  return new Fight(loadout(m.players[a], m.round), loadout(m.players[b], m.round), (m.seed + m.round * 31337 + a * 101 + b * 7) >>> 0);
}

function damageFor(round, survivorHpPct) {
  return 1 + Math.ceil(round * 0.8) + Math.round(survivorHpPct * 4);
}

// Apply a finished fight. Returns a summary for the UI.
function resolveFight(m, a, b, result, ghost = false) {
  const pa = m.players[a], pb = m.players[b];
  let summary;
  if (result.winner === -1) {
    const d = Math.ceil(damageFor(m.round, 0) / 2);
    pa.hp -= d;
    if (!ghost) pb.hp -= d;
    summary = { round: m.round, winner: null, damage: d, time: result.time };
  } else {
    const winner = result.winner === 0 ? pa : pb;
    const loser = result.winner === 0 ? pb : pa;
    const d = damageFor(m.round, result.survivorHpPct);
    if (!(ghost && loser === pb)) loser.hp -= d;
    winner.wins++;
    summary = { round: m.round, winner: winner.id, loser: loser.id, damage: d, time: result.time };
  }
  summary.a = a; summary.b = b; summary.ghost = !!ghost;
  pa.lastOpp = b;
  if (!ghost) pb.lastOpp = a;
  m.history.push(summary);
  return summary;
}

// Plays every fight of the round except `skip` (pairs the UI animates itself).
function resolveOtherFights(m, skip = []) {
  const out = [];
  for (const [a, b, ghost] of m.pairs) {
    if (skip.includes(a) || (!ghost && skip.includes(b))) continue;
    out.push(resolveFight(m, a, b, makeFight(m, a, b).runToEnd(), ghost));
  }
  return out;
}

// Eliminates players at 0 HP (placing them), then starts the next round or
// ends the match. Players knocked out in the same round are ranked by HP left
// (most negative is worse), then by fights won.
function finishRound(m) {
  const out = m.players.filter((p) => p.hp <= 0 && p.placement === null)
    .sort((a, b) => b.hp - a.hp || b.wins - a.wins);
  let place = alive(m).length + out.length;
  for (const p of out.reverse()) p.placement = place--;
  for (const p of m.players) p.hp = Math.max(0, p.hp);
  const live = alive(m);
  if (live.length <= 1) {
    // If the last players all fell at once, the best-ranked of them already
    // holds 1st place from the ordering above.
    if (live.length === 1) live[0].placement = 1;
    m.phase = 'over';
    return;
  }
  startRound(m);
}

function standings(m) {
  return m.players.slice().sort((a, b) => (a.placement ?? 0) - (b.placement ?? 0) || b.hp - a.hp || b.wins - a.wins);
}
