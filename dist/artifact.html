// ---- src/ai/bot.js

// The rival. Three levels:
//   easy    commits loosely to its gladiator's tags, buys on impulse
//   normal  plans a two-resource build, manages gold, chases tier unlocks and
//           hybrids, and buys counters to your main resource
//   hard    everything normal does, then test-fights its top candidate cards
//           against your current build before buying, and picks signatures
//           the same way
// The bot only sees what a human would see: your gladiator and your cards.

const LEVELS = {
  easy:   { noise: 3, rerolls: 1, counters: false, economy: false, sims: 0, spendAll: 0 },
  normal: { noise: 0.6, rerolls: 4, counters: true, economy: true, sims: 0, spendAll: -1, valueWeight: 14, planWeight: 0.35 },
  hard:   { noise: 0.2, rerolls: 7, counters: true, economy: true, sims: 4, simTop: 3, simWeight: 6, spendAll: -1, valueWeight: 14, planWeight: 0.35 },
};
const level = (p) => LEVELS[p.level] || LEVELS.normal;

// Resources that tend to dominate bot-vs-bot play; smarter bots ban these.
const THREAT = { poison: 3, regen: 3, bleed: 2, shield: 2, armor: 1.5, fire: 1.5, frost: 1.2, arcane: 1, lightning: 1.2 };

function botBan(m, id) {
  const p = m.players[id];
  const rng = rngFor(m);
  if (p.level === 'easy') return submitBan(m, id, rng.pick(RESOURCES));
  let r = rng() * RESOURCES.reduce((s, x) => s + THREAT[x], 0);
  for (const x of RESOURCES) { r -= THREAT[x]; if (r <= 0) return submitBan(m, id, x); }
  submitBan(m, id, RESOURCES[0]);
}

function botPick(m, id, preferred) {
  const rng = rngFor(m);
  const vis = visibleCharacters(m.bans);
  const ok = vis.filter((v) => v.status === 'ok');
  const pool = ok.length ? ok : vis;
  const choice = (preferred && pool.find((v) => v.char.id === preferred)) || rng.pick(pool);
  pickCharacter(m, id, choice.char.id);
}

function botSignature(m, id) {
  const p = m.players[id];
  const sigs = CHAR_BY_ID[p.charId].signatures;
  if (level(p).sims) {
    const enemy = rivalOf(m, id);
    let best = sigs[0], bestScore = -Infinity;
    for (const s of sigs) {
      const score = evaluate({ ...loadout(p, m.round), sig: s.id }, loadout(enemy, m.round), m, 6);
      if (score > bestScore) { bestScore = score; best = s; }
    }
    return chooseSignature(m, id, best.id);
  }
  chooseSignature(m, id, rngFor(m).pick(sigs).id);
}

// The bot plans against this round's opponent (pairings are public once the
// round starts, as they would be for a player).
function rivalOf(m, id) {
  const opp = opponentOf(m, id);
  if (opp) return m.players[opp.id];
  return m.players.find((q) => q.id !== id && q.hp > 0) || m.players[(id + 1) % m.players.length];
}

// Pure gladiators get a second resource: the one their trigger feeds best.
const PARTNER = { strike: ['bleed', 'shield', 'poison'], spell: ['arcane', 'shield', 'poison'], pain: ['armor', 'shield', 'bleed'],
  precision: ['poison', 'bleed', 'fire'], evasion: ['poison', 'shield', 'frost'] };

function plan(m, p) {
  if (p.plan) return p.plan;
  const ch = CHAR_BY_ID[p.charId];
  const rng = rngFor(m);
  const resources = ch.resources.filter((r) => !m.bans.includes(r));
  const open = RESOURCES.filter((r) => !m.bans.includes(r) && !resources.includes(r));
  while (resources.length < 2) {
    const pref = p.level === 'easy' ? [] : PARTNER[ch.trigger].filter((r) => open.includes(r));
    const pick = pref.length ? pref[0] : rng.pick(open);
    resources.push(pick);
    open.splice(open.indexOf(pick), 1);
  }
  p.plan = { trigger: ch.trigger, resources };
  return p.plan;
}

// Heuristic value of one more copy of `card` for this player.
function scoreCard(card, p, enemy, pl, lv = LEVELS.normal) {
  const res = cardResources(card);
  const trig = card.tags.filter((t) => TRIGGERS.includes(t));
  const counts = tagCounts(p.cards);
  const have = p.cards[card.id] || 0;

  if (card.tier === 'counter') {
    if (!lv.counters) return -1;
    const ec = tagCounts(enemy.cards);
    const threat = card.counters === 'evasion' ? (ec.evasion || 0) + (CHAR_BY_ID[enemy.charId].trigger === 'evasion' ? 6 : 0) : ec[card.counters] || 0;
    if (threat < 5) return -1;
    return 3 + Math.min(5, (threat - 5) * 0.5) - have * 1.5;
  }
  if (card.tier === 'hybrid') return res.every((r) => pl.resources.includes(r)) ? 9 : -1;

  let s = 0;
  if (!lv.economy) {
    // Easy: commit to the gladiator's tags and favor higher tiers.
    for (const r of res) s += pl.resources.includes(r) ? 3 : -2.5;
    for (const t of trig) s += t === pl.trigger ? 2.5 : -1.5;
    if (typeof card.tier === 'number') s += (card.tier - 1) * 1.1;
    return s;
  }

  // Measured value of the card (see tools/cardvalue.mjs), using the value
  // for gladiators that share its tags when this one does.
  const ch = CHAR_BY_ID[p.charId];
  const v = CARD_VALUES[card.id] || { all: 0, fit: null };
  const fits = card.tags.some((t) => t === ch.trigger || ch.resources.includes(t));
  s += ((fits && v.fit !== null ? v.fit : v.all) * lv.valueWeight) / Math.sqrt(cardCost(card) / 2);
  // Plan synergy on top.
  for (const r of res) s += pl.resources.includes(r) ? lv.planWeight : -lv.planWeight * 0.6;
  for (const t of trig) s += t === pl.trigger ? lv.planWeight * 0.8 : -lv.planWeight * 0.3;

  // Cards that push a planned tag over a tier threshold are worth more.
  for (const t of card.tags) {
    if (t !== pl.trigger && !pl.resources.includes(t)) continue;
    const n = counts[t] || 0;
    for (const k of [2, 3, 4]) if (n + 1 === TIER_UNLOCK[k]) s += 1.5;
    if (pl.resources.includes(t) && n + 1 === HYBRID_REQ) s += 1;
  }
  // Pure trigger boosters only matter if the trigger is actually used.
  if (!res.length && trig.length && trig[0] !== pl.trigger) s -= 2;
  // Copies past the third give less.
  if (have >= 3) s -= 0.5 * (have - 2);
  return s;
}

// Average fight outcome of `mine` vs `theirs`: +1..+2 for wins (more for HP
// left), -1..-2 for losses (more for the enemy's HP left).
function evaluate(mine, theirs, m, n) {
  let total = 0;
  for (let i = 0; i < n; i++) {
    const r = new Fight(mine, theirs, (m.seed + m.round * 977 + i * 7919) >>> 0).runToEnd();
    if (r.winner === 0) total += 1 + r.survivorHpPct;
    else if (r.winner === 1) total -= 1 + r.survivorHpPct;
  }
  return total / n;
}

function botShop(m, id) {
  const p = m.players[id];
  const lv = level(p);
  const enemy = rivalOf(m, id);
  const pl = plan(m, p);
  const rng = rngFor(m);
  const enemyLo = loadout(enemy, m.round);
  const simulate = lv.sims > 0 && Object.keys(enemy.cards).length > 0;
  let base = simulate ? evaluate(loadout(p, m.round), enemyLo, m, lv.sims) : 0;
  let rerolls = 0;

  for (let guard = 0; guard < 40; guard++) {
    const options = [];
    p.shop.forEach((cid, i) => {
      if (!cid) return;
      const card = CARD_BY_ID[cid];
      if (cardCost(card) > p.gold || (p.cards[cid] || 0) >= card.max) return;
      options.push({ i, card, s: scoreCard(card, p, enemy, pl, lv) + (rng() - 0.5) * 2 * lv.noise });
    });
    options.sort((a, b) => b.s - a.s);

    if (simulate) {
      // Test-fight the top candidates. Long-term synergy still counts, so
      // blend the measured gain with the heuristic.
      for (const o of options.slice(0, lv.simTop)) {
        if (o.s < 1) continue;
        const cards = { ...p.cards, [o.card.id]: (p.cards[o.card.id] || 0) + 1 };
        o.gain = evaluate({ ...loadout(p, m.round), cards }, enemyLo, m, lv.sims) - base;
        o.s += o.gain * lv.simWeight;
      }
      options.sort((a, b) => b.s - a.s);
    }

    const best = options[0];
    const threshold = lv.economy && m.round <= 3 && p.gold - (best ? cardCost(best.card) : 0) < INTEREST_STEP * INTEREST_MAX && p.gold >= INTEREST_STEP * INTEREST_MAX - 2 ? 4.5 : 2.5;
    if (best && best.s > threshold) {
      buy(m, id, best.i);
      if (simulate && best.gain !== undefined) base += best.gain;
      continue;
    }
    // Reroll when nothing fits, but protect interest in the early rounds.
    const keep = lv.economy && m.round <= 4 ? INTEREST_STEP * INTEREST_MAX : 0;
    if (rerolls < lv.rerolls && p.gold - REROLL_COST >= Math.max(2, keep)) { reroll(m, id); rerolls++; continue; }
    if (rerolls < lv.rerolls && p.gold >= REROLL_COST + 2 && m.round > 4) { reroll(m, id); rerolls++; continue; }
    // Out of rerolls: unspent gold is wasted power, so take the best card
    // that at least doesn't hurt the plan (beyond what interest would earn).
    if (lv.spendAll && best && best.s > lv.spendAll && p.gold - cardCost(best.card) >= keep) {
      buy(m, id, best.i);
      if (simulate && best.gain !== undefined) base += best.gain;
      continue;
    }
    break;
  }
}

// ---- src/game/host.js

// The authoritative game loop. It owns the match state, runs the bots,
// enforces timers and moves between phases. A solo game is a host with no
// remote players; online, remote players' actions arrive through act() and
// every change is broadcast.
//
// Phases: ban -> pick -> (signature) -> shop -> fight -> shop ... -> over
// Timers are in seconds; shopTime 0 turns all timers off (solo only).

const PHASE_TIME = { ban: 20, pick: 30, signature: 20, watch: 120 };
const SHOP_TIMES = [0, 20, 30, 45];
const RESULTS_TIME = 8; // seconds after the longest fight before the next round

class HostGame {
  // players: [{ name, isBot, level }]; player 0 is the host.
  constructor({ players, seed = Math.floor(Math.random() * 1e9), shopTime = 30, now = () => Date.now() }) {
    this.now = now;
    this.listeners = new Set();
    this.M = createMatch({ seed, players });
    this.M.settings = { shopTime };
    this.M.ready = {};
    this.M.watched = {};
    this.M.lastResults = [];
    this.M.hpBefore = {};
    this.M.deadline = null;
    for (const p of this.M.players) if (p.isBot) botBan(this.M, p.id);
    this.setDeadline(PHASE_TIME.ban);
    this.advance();
  }

  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  changed() { for (const fn of this.listeners) fn(this.M); }

  // Seconds left on the current phase's clock, or null with no timer.
  remaining() {
    return this.M.deadline == null ? null : Math.max(0, (this.M.deadline - this.now()) / 1000);
  }

  setDeadline(seconds) {
    this.M.deadline = this.M.settings.shopTime ? this.now() + seconds * 1000 : null;
  }

  humans(liveOnly = false) {
    return this.M.players.filter((p) => !p.isBot && (!liveOnly || p.hp > 0));
  }

  // A player action. Returns true if it changed anything.
  act(id, action, value) {
    const m = this.M;
    const p = m.players[id];
    if (!p || p.isBot) return false;
    let ok = false;
    switch (action) {
      case 'ban':
        if (m.phase === 'ban' && !p.ban && RESOURCES.includes(value)) { submitBan(m, id, value); ok = true; }
        break;
      case 'pick':
        if (m.phase === 'pick' && !p.charId) ok = pickCharacter(m, id, value);
        break;
      case 'sig':
        if (m.phase === 'signature' && !p.sig && p.hp > 0 && CHAR_BY_ID[p.charId].signatures.some((s) => s.id === value)) {
          chooseSignature(m, id, value); ok = true;
        }
        break;
      case 'buy':
        if (m.phase === 'shop' && p.hp > 0) ok = buy(m, id, Number(value));
        break;
      case 'reroll':
        if (m.phase === 'shop' && p.hp > 0) ok = reroll(m, id);
        break;
      case 'lock':
        if (m.phase === 'shop' && p.hp > 0) { toggleLock(m, id); ok = true; }
        break;
      case 'ready':
        if (m.phase === 'shop' && p.hp > 0) { m.ready[id] = value !== false; ok = true; }
        break;
      case 'watched':
        if (m.phase === 'fight') { m.watched[id] = true; ok = true; }
        break;
    }
    if (ok) { this.advance(); this.changed(); }
    return ok;
  }

  // A human left: a bot takes over their gladiator.
  replaceWithBot(id) {
    const p = this.M.players[id];
    if (!p || p.isBot) return;
    p.isBot = true;
    p.level = 'normal';
    p.name = `${p.name} (bot)`;
    const m = this.M;
    if (m.phase === 'ban' && !p.ban) botBan(m, id);
    if (m.phase === 'pick' && !p.charId) botPick(m, id);
    if (m.phase === 'signature' && !p.sig && p.hp > 0) botSignature(m, id);
    if (m.phase === 'shop' && p.hp > 0) botShop(m, id);
    this.advance();
    this.changed();
  }

  // The human who left comes back and takes their gladiator over again.
  rejoin(id, name) {
    const p = this.M.players[id];
    if (!p) return;
    p.isBot = false;
    p.level = null;
    p.name = name;
    this.changed();
  }

  // Called every few hundred ms; applies defaults when a clock runs out.
  tick() {
    const m = this.M;
    if (m.deadline == null || this.now() < m.deadline || m.phase === 'over') return;
    const rng = makeRng((m.seed ^ (m.round * 2654435761)) >>> 0);
    if (m.phase === 'ban') {
      for (const p of this.humans()) if (!p.ban) submitBan(m, p.id, rng.pick(RESOURCES));
    } else if (m.phase === 'pick') {
      const vis = visibleCharacters(m.bans);
      for (const p of this.humans()) if (!p.charId) pickCharacter(m, p.id, rng.pick(vis).char.id);
    } else if (m.phase === 'signature') {
      for (const p of this.humans(true)) if (!p.sig) chooseSignature(m, p.id, rng.pick(CHAR_BY_ID[p.charId].signatures).id);
    } else if (m.phase === 'shop') {
      this.runFights();
    } else if (m.phase === 'fight') {
      this.endRound();
    }
    this.advance();
    this.changed();
  }

  // Moves on whenever the current phase's requirements are met. Phase changes
  // made inside the engine (bans resolved, round started) are picked up here.
  advance() {
    const m = this.M;
    // Each round takes a few passes; with no humans left the bots play the
    // rest of the match out inside this loop.
    for (let guard = 0; guard < 5000; guard++) {
      const phase = m.phase;
      if (phase === 'pick' && this.enteredPhase !== 'pick') {
        this.enteredPhase = 'pick';
        for (const p of m.players) if (p.isBot) botPick(m, p.id);
        this.setDeadline(PHASE_TIME.pick);
        continue;
      }
      if ((phase === 'signature' || phase === 'shop') && this.enteredRound !== m.round) {
        // A new round has started.
        this.enteredRound = m.round;
        m.ready = {};
        const bots = m.players.filter((p) => p.isBot && p.hp > 0);
        if (phase === 'signature') {
          for (const p of bots) botSignature(m, p.id);
          this.setDeadline(PHASE_TIME.signature);
        }
        if (m.phase === 'shop') this.enterShop();
        continue;
      }
      if (phase === 'shop' && this.enteredShop !== m.round) { this.enterShop(); continue; }
      if (phase === 'shop') {
        const live = this.humans(true);
        if (live.length === 0 || live.every((p) => m.ready[p.id])) { this.runFights(); continue; }
      }
      if (phase === 'fight') {
        const waiting = this.watchers().filter((id) => !m.watched[id]);
        if (waiting.length === 0) { this.endRound(); continue; }
      }
      break;
    }
  }

  enterShop() {
    const m = this.M;
    this.enteredShop = m.round;
    for (const p of m.players) if (p.isBot && p.hp > 0) botShop(m, p.id);
    this.setDeadline(m.settings.shopTime || 0);
  }

  // Humans who fought this round and still need to watch their fight.
  watchers() {
    return (this.M.watchers || []).filter((id) => !this.M.players[id].isBot);
  }

  runFights() {
    const m = this.M;
    if (m.phase !== 'shop') return;
    m.hpBefore = Object.fromEntries(m.players.map((p) => [p.id, p.hp]));
    m.watchers = this.humans(true).filter((p) => opponentOf(m, p.id)).map((p) => p.id);
    m.lastResults = resolveOtherFights(m, []);
    m.phase = 'fight';
    m.watched = {};
    m.fightRound = m.round;
    // The round moves on by itself once every fight has played out at 1x,
    // plus a few seconds to read the results; nobody can hold it up.
    const longest = Math.max(0, ...m.lastResults.map((r) => r.time));
    this.setDeadline(Math.min(PHASE_TIME.watch, longest + RESULTS_TIME));
  }

  endRound() {
    const m = this.M;
    if (m.phase !== 'fight') return;
    finishRound(m);
    if (m.phase === 'over') m.deadline = null;
  }
}

// ---- src/net/transport.js
// Network transports. Both give the host and clients the same small API:
//   host:   { code, onJoin(fn(conn)), onMessage(fn(conn, msg)), onLeave(fn(conn)), send(conn, msg), broadcast(msg), close() }
//   client: { send(msg), onMessage(fn(msg)), onClose(fn()), close() }
//
// 'peer'  WebRTC through PeerJS. PeerJS's free public server only introduces
//         the browsers; game traffic then flows directly between them.
// 'local' BroadcastChannel between tabs of one browser, for testing.

const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const PREFIX = 'stack-arena-room-';
const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

function newRoomCode() {
  let s = '';
  for (let i = 0; i < 5; i++) s += CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)];
  return s;
}

function cleanCode(code) {
  return String(code || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5);
}

let peerJsPromise = null;
function loadPeerJs() {
  if (window.Peer) return Promise.resolve(window.Peer);
  peerJsPromise ??= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = PEERJS_URL;
    s.onload = () => (window.Peer ? resolve(window.Peer) : reject(new Error('PeerJS did not load.')));
    s.onerror = () => { peerJsPromise = null; reject(new Error('Could not load the networking library. Check your connection.')); };
    document.head.appendChild(s);
  });
  return peerJsPromise;
}

function emitter() {
  const subs = {};
  return {
    on: (ev, fn) => { (subs[ev] ??= []).push(fn); },
    emit: (ev, ...args) => { for (const fn of subs[ev] || []) fn(...args); },
  };
}

function withTimeout(promise, ms, message) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))]);
}

// ---------------------------------------------------------------- PeerJS

async function peerHost() {
  const Peer = await loadPeerJs();
  for (let attempt = 0; attempt < 4; attempt++) {
    const code = newRoomCode();
    try {
      const peer = await withTimeout(new Promise((resolve, reject) => {
        const p = new Peer(PREFIX + code);
        p.on('open', () => resolve(p));
        p.on('error', (e) => reject(e));
      }), 12000, 'Could not reach the matchmaking server.');
      const ev = emitter();
      const conns = new Map();
      peer.on('connection', (conn) => {
        conn.on('open', () => { conns.set(conn.peer, conn); ev.emit('join', conn.peer); });
        conn.on('data', (msg) => ev.emit('message', conn.peer, msg));
        const leave = () => { if (conns.delete(conn.peer)) ev.emit('leave', conn.peer); };
        conn.on('close', leave);
        conn.on('error', leave);
      });
      peer.on('disconnected', () => { try { peer.reconnect(); } catch { /* already destroyed */ } });
      return {
        code,
        onJoin: (fn) => ev.on('join', fn),
        onMessage: (fn) => ev.on('message', fn),
        onLeave: (fn) => ev.on('leave', fn),
        send: (id, msg) => conns.get(id)?.send(msg),
        broadcast: (msg) => { for (const c of conns.values()) c.send(msg); },
        kick: (id) => { conns.get(id)?.close(); conns.delete(id); },
        close: () => peer.destroy(),
      };
    } catch (e) {
      if (e?.type !== 'unavailable-id') throw new Error(e?.message || 'Could not open a room.');
    }
  }
  throw new Error('Could not open a room. Try again.');
}

async function peerJoin(code) {
  const Peer = await loadPeerJs();
  const peer = new Peer();
  const ev = emitter();
  const conn = await withTimeout(new Promise((resolve, reject) => {
    peer.on('error', (e) => reject(new Error(e?.type === 'peer-unavailable' ? `No room called ${code}. Check the code with your host.` : e?.message || 'Could not connect.')));
    peer.on('open', () => {
      const c = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' });
      c.on('open', () => resolve(c));
      c.on('error', (e) => reject(e));
    });
  }), 15000, 'Timed out connecting to the room. The host may be offline, or your network may block peer-to-peer connections.');
  conn.on('data', (msg) => ev.emit('message', msg));
  conn.on('close', () => ev.emit('close'));
  // Losing the matchmaking server doesn't affect the open game connection.
  peer.on('disconnected', () => { try { peer.reconnect(); } catch { /* already destroyed */ } });
  return {
    send: (msg) => conn.send(msg),
    onMessage: (fn) => ev.on('message', fn),
    onClose: (fn) => ev.on('close', fn),
    close: () => peer.destroy(),
  };
}

// ---------------------------------------------------------------- local

function localHost() {
  const code = newRoomCode();
  const ch = new BroadcastChannel(PREFIX + code);
  const ev = emitter();
  const conns = new Set();
  ch.onmessage = ({ data }) => {
    if (data.to !== 'host') return;
    if (data.type === 'hello') { conns.add(data.from); ev.emit('join', data.from); }
    else if (data.type === 'bye') { if (conns.delete(data.from)) ev.emit('leave', data.from); }
    else if (conns.has(data.from)) ev.emit('message', data.from, data.msg);
  };
  return {
    code,
    onJoin: (fn) => ev.on('join', fn),
    onMessage: (fn) => ev.on('message', fn),
    onLeave: (fn) => ev.on('leave', fn),
    send: (id, msg) => ch.postMessage({ to: id, msg }),
    broadcast: (msg) => ch.postMessage({ to: '*', msg }),
    kick: (id) => { conns.delete(id); ch.postMessage({ to: id, type: 'kick' }); },
    close: () => { ch.postMessage({ to: '*', type: 'close' }); ch.close(); },
  };
}

function localJoin(code) {
  const id = 'tab-' + Math.random().toString(36).slice(2);
  const ch = new BroadcastChannel(PREFIX + code);
  const ev = emitter();
  ch.onmessage = ({ data }) => {
    if (data.to !== id && data.to !== '*') return;
    if (data.type === 'close' || data.type === 'kick') ev.emit('close');
    else ev.emit('message', data.msg);
  };
  window.addEventListener('pagehide', () => ch.postMessage({ to: 'host', from: id, type: 'bye' }));
  ch.postMessage({ to: 'host', from: id, type: 'hello' });
  return {
    send: (msg) => ch.postMessage({ to: 'host', from: id, msg }),
    onMessage: (fn) => ev.on('message', fn),
    onClose: (fn) => ev.on('close', fn),
    close: () => { ch.postMessage({ to: 'host', from: id, type: 'bye' }); ch.close(); },
  };
}

async function hostRoom(kind = 'peer') {
  return kind === 'local' ? localHost() : peerHost();
}

async function joinRoom(code, kind = 'peer') {
  return kind === 'local' ? localJoin(code) : peerJoin(code);
}

// ---- src/game/session.js

// A session is what the UI talks to. Solo games, hosted rooms and joined
// rooms all look the same:
//   stage       'lobby' | 'game' | 'closed'
//   M           match state (read-only for the UI)
//   me          your player id
//   remaining() seconds left on the phase clock, or null
//   act(a, v)   ban | pick | sig | buy | reroll | lock | ready | watched
//   onChange(fn)
// Hosted rooms also manage lobby slots; joined rooms only mirror the host.

const PROTOCOL = 1;
const BOT_NAMES = ['Varro', 'Lucia', 'Crixus', 'Flamma', 'Priscus', 'Verus', 'Tetraites'];

function changeEmitter() {
  const subs = new Set();
  return { on: (fn) => { subs.add(fn); return () => subs.delete(fn); }, emit: () => { for (const fn of subs) fn(); } };
}

// A random id kept in this browser so a player who drops out of a match can
// come back to the same gladiator by joining the room code again.
function playerToken() {
  try {
    let t = localStorage.getItem('stack-arena-token');
    if (!t) { t = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('stack-arena-token', t); }
    return t;
  } catch { return Math.random().toString(36).slice(2); }
}

const cleanName = (s) => String(s || '').replace(/[<>&"]/g, '').trim().slice(0, 16) || 'Gladiator';

function soloSession({ bots, shopTime }) {
  const ev = changeEmitter();
  const host = new HostGame({
    players: [{ name: 'You' }, ...bots.map((level, i) => ({ name: BOT_NAMES[i], isBot: true, level }))],
    shopTime,
  });
  host.onChange(ev.emit);
  const timer = setInterval(() => host.tick(), 250);
  return {
    mode: 'solo', stage: 'game', me: 0,
    get M() { return host.M; },
    remaining: () => host.remaining(),
    act: (a, v) => host.act(0, a, v),
    onChange: ev.on,
    close: () => clearInterval(timer),
  };
}

async function hostSession({ name, kind = 'peer' }) {
  const t = await hostRoom(kind);
  const ev = changeEmitter();
  let host = null;
  let timer = 0;
  const connToPlayer = new Map();
  // Who each human player was, so they can rejoin after leaving: id -> { token, name }.
  let seats = new Map();
  const s = {
    mode: 'host', stage: 'lobby', me: 0, code: t.code, shopTime: 30,
    slots: [{ kind: 'host', name: cleanName(name) }, { kind: 'open' }],
    get M() { return host?.M; },
    remaining: () => host?.remaining() ?? null,
    act: (a, v) => host?.act(0, a, v),
    onChange: ev.on,

    setSlot(i, spec) {
      const slot = s.slots[i];
      if (!slot || slot.kind === 'host') return;
      if (slot.kind === 'human') { t.send(slot.conn, { t: 'refused', reason: 'The host removed you from the room.' }); t.kick(slot.conn); }
      s.slots[i] = spec;
      lobbyChanged();
    },
    addSlot(spec = { kind: 'open' }) {
      if (s.slots.length < MAX_PLAYERS) { s.slots.push(spec); lobbyChanged(); }
    },
    removeSlot(i) {
      if (s.slots[i]?.kind === 'host' || s.slots.length <= 2) return;
      if (s.slots[i].kind === 'human') { t.send(s.slots[i].conn, { t: 'refused', reason: 'The host removed you from the room.' }); t.kick(s.slots[i].conn); }
      s.slots.splice(i, 1);
      lobbyChanged();
    },
    setShopTime(sec) { s.shopTime = sec; lobbyChanged(); },
    canStart: () => s.slots.filter((x) => x.kind !== 'open').length >= 2,

    start() {
      if (!s.canStart()) return;
      const filled = s.slots.filter((x) => x.kind !== 'open');
      let botIndex = 0;
      const players = filled.map((x) => (x.kind === 'bot'
        ? { name: BOT_NAMES[botIndex++ % BOT_NAMES.length], isBot: true, level: x.level }
        : { name: x.name }));
      connToPlayer.clear();
      seats = new Map();
      filled.forEach((x, id) => { if (x.kind === 'human') { connToPlayer.set(x.conn, id); seats.set(id, { token: x.token, name: x.name }); } });
      host = new HostGame({ players, shopTime: s.shopTime || 20 });
      host.onChange(() => { broadcastState(); ev.emit(); });
      for (const [conn, id] of connToPlayer) t.send(conn, { t: 'start', you: id });
      s.stage = 'game';
      clearInterval(timer);
      timer = setInterval(() => host.tick(), 250);
      broadcastState();
      ev.emit();
    },
    backToLobby() {
      clearInterval(timer);
      host = null;
      s.stage = 'lobby';
      lobbyChanged();
    },
    close() {
      clearInterval(timer);
      t.close();
      s.stage = 'closed';
    },
  };

  function lobbyView() {
    return {
      code: s.code, shopTime: s.shopTime,
      slots: s.slots.map((x) => ({ kind: x.kind, name: x.name, level: x.level })),
    };
  }
  function lobbyChanged() {
    s.slots.forEach((x, i) => { if (x.kind === 'human') t.send(x.conn, { t: 'lobby', lobby: lobbyView(), you: i }); });
    ev.emit();
  }
  function broadcastState() {
    if (host) t.broadcast({ t: 'state', M: host.M, remaining: host.remaining() });
  }

  t.onMessage((conn, msg) => {
    if (!msg || typeof msg !== 'object') return;
    if (msg.t === 'hello') {
      if (msg.v !== PROTOCOL) { t.send(conn, { t: 'refused', reason: 'You have a different version of the game. Reload the page and try again.' }); return t.kick(conn); }
      if (s.stage !== 'lobby') {
        if (host && rejoin(conn, msg)) return;
        t.send(conn, { t: 'refused', reason: 'That match has already started.' });
        return t.kick(conn);
      }
      const i = s.slots.findIndex((x) => x.kind === 'open');
      if (i < 0) { t.send(conn, { t: 'refused', reason: 'The room is full.' }); return t.kick(conn); }
      s.slots[i] = { kind: 'human', name: cleanName(msg.name), conn, token: String(msg.token || '') };
      lobbyChanged();
    } else if (msg.t === 'act' && s.stage === 'game' && host) {
      const id = connToPlayer.get(conn);
      if (id != null) host.act(id, msg.a, msg.v);
    }
  });
  // A player who left (or dropped) joins the same code again: they get their
  // gladiator back from the bot. Matched by browser token, else by name.
  function rejoin(conn, msg) {
    const token = String(msg.token || '');
    const name = cleanName(msg.name);
    let id = null;
    for (const [pid, seat] of seats) if (token && seat.token === token) id = pid;
    if (id == null) for (const [pid, seat] of seats) if (seat.name === name && host.M.players[pid].isBot) id = pid;
    if (id == null) return false;
    for (const [c, pid] of connToPlayer) if (pid === id) { connToPlayer.delete(c); t.kick(c); }
    host.rejoin(id, seats.get(id).name);
    connToPlayer.set(conn, id);
    t.send(conn, { t: 'start', you: id });
    t.send(conn, { t: 'state', M: host.M, remaining: host.remaining() });
    return true;
  }

  t.onLeave((conn) => {
    const i = s.slots.findIndex((x) => x.kind === 'human' && x.conn === conn);
    if (i >= 0) s.slots[i] = { kind: 'open' };
    if (s.stage === 'game' && host && connToPlayer.has(conn)) {
      host.replaceWithBot(connToPlayer.get(conn));
      connToPlayer.delete(conn);
    } else if (s.stage === 'lobby') lobbyChanged();
  });
  return s;
}

async function clientSession({ code, name, kind = 'peer' }) {
  const t = await joinRoom(code, kind);
  const ev = changeEmitter();
  let deadline = null;
  const s = {
    mode: 'client', stage: 'connecting', me: null, code, M: null, lobby: null, slot: null, closedReason: null,
    remaining: () => (deadline == null ? null : Math.max(0, (deadline - Date.now()) / 1000)),
    act: (a, v) => t.send({ t: 'act', a, v }),
    onChange: ev.on,
    close: () => { t.close(); s.stage = 'closed'; },
  };
  const ready = new Promise((resolve, reject) => {
    const timeout = setTimeout(() => reject(new Error('The host did not answer. Check the room code.')), 8000);
    t.onMessage((msg) => {
      if (msg.t === 'start') { clearTimeout(timeout); resolve(); }
      if (msg.t === 'lobby') {
        clearTimeout(timeout);
        s.lobby = msg.lobby; s.slot = msg.you;
        if (s.stage !== 'game' || !s.M || s.M.phase === 'over') s.stage = 'lobby';
        resolve();
      } else if (msg.t === 'start') {
        s.me = msg.you; s.stage = 'game'; s.M = null;
      } else if (msg.t === 'state') {
        s.M = msg.M;
        deadline = msg.remaining == null ? null : Date.now() + msg.remaining * 1000;
        if (s.me != null) s.stage = 'game';
      } else if (msg.t === 'refused') {
        clearTimeout(timeout);
        s.closedReason = msg.reason;
        s.stage = 'closed';
        reject(new Error(msg.reason));
      }
      ev.emit();
    });
  });
  t.onClose(() => {
    if (s.stage === 'closed') return;
    s.stage = 'closed';
    s.closedReason ??= 'The host closed the room.';
    ev.emit();
  });
  t.send({ t: 'hello', name: cleanName(name), v: PROTOCOL, token: playerToken() });
  await ready;
  return s;
}

// ---- src/ui/arena.js

// Canvas renderer for the pit. It either shows a static preview of both
// gladiators or plays a Fight forward in real time at the chosen speed.
// The pit is drawn as a tilted board seen from behind your gladiator, like an
// auto-battler camera: you stand near the front left, your opponent at the
// back right.

const SELF_STACKS = ['fire', 'shield', 'regen', 'arcane', 'lightning', 'armor'];

// tools/pixellab.mjs). Gladiators without sprites are drawn as medallions.

    spriteCache[charId] = Object.fromEntries(Object.entries(data).map(([k, v]) => [k, (Array.isArray(v) ? v : [v]).map(load)]));
  }

// Seconds a new clip takes to fade in over the last frame of the old one.

  tintCanvas ??= document.createElement('canvas');
  tintCanvas.width = img.naturalWidth; tintCanvas.height = img.naturalHeight;
  const t = tintCanvas.getContext('2d');
  t.clearRect(0, 0, tintCanvas.width, tintCanvas.height);
  t.globalCompositeOperation = 'source-over';
  t.drawImage(img, 0, 0);
  t.globalCompositeOperation = 'source-atop';
  t.globalAlpha = alpha;
  t.fillStyle = color;
  t.fillRect(0, 0, tintCanvas.width, tintCanvas.height);
  t.globalAlpha = 1;
  return tintCanvas;

  let fight = null;
  let onDone = null;
  let speed = 2;
  let acc = 0;
  let last = 0;
  let raf = 0;
  let floaters = [];
  let fx = [];
  let strikes = []; // lightning bolts on screen
  let names = ['', '']; // player names shown over each fighter
  let flip = false; // draw unit 1 on the left
  let mystery = false; // the right fighter is an unrevealed opponent
  // Standings on the back wall: one plaque per player, best on the left.
  let board = [], plaqueX = {}, plaqueRects = [], onPick = null;

  const setClip = (a, clip) => { a.from = { clip: a.clip, clipT: a.clipT }; a.clip = clip; a.clipT = 0; };
  // A sprite without a clip (say, no hurt frames) keeps playing what it was.
  const startClip = (a, clip) => {

    if (a.clip !== 'death' && (!set || set[clip])) setClip(a, clip);

    if (fx.length > 260) return;
    const p = pos(u.side), r = radius(u.side);
    const feet = p.y + r * 1.05;
    for (const [k, def] of Object.entries(STATUS_FX)) {
      const on = k === 'frost' ? u.frost >= 1 || u.frozen > 0 : u[k] >= 1;
      if (!on) { a.spawn[k] = 0; continue; }
      a.spawn[k] = (a.spawn[k] || 0) + dt * def.per(u) * (reduceMotion ? 0.3 : 1);
      while (a.spawn[k] >= 1) {
        a.spawn[k] -= 1;
        const rx = (Math.random() - 0.5) * r * 1.1;
        if (k === 'poison') fx.push({ kind: 'bubble', x: p.x + rx, y: p.y + Math.random() * r * 0.6, vx: (Math.random() - 0.5) * 8, vy: -18 - Math.random() * 16, size: 3 + Math.random() * 4 * p.k, ttl: 1.3, life: 1, color: TAGS.poison.color });
        else if (k === 'bleed') fx.push({ kind: 'drop', x: p.x + rx * 0.8, y: p.y - r * 0.2 + Math.random() * r * 0.6, vx: (Math.random() - 0.5) * 10, vy: 10, g: 260, floor: feet - Math.random() * r * 0.15, size: 2.2 + Math.random() * 2.4 * p.k, ttl: 1.8, life: 1, color: TAGS.bleed.color });
        else if (k === 'fire') fx.push({ kind: 'flame', x: p.x + rx, y: feet - Math.random() * r * 0.3, vx: (Math.random() - 0.5) * 6, vy: -30 - Math.random() * 25, size: 3 + Math.random() * 3 * p.k, ttl: 0.7, life: 1, color: TAGS.fire.color });
        else if (k === 'regen') fx.push({ kind: 'cross', x: p.x + rx, y: p.y + r * 0.2, vx: 0, vy: -22, size: 3 + p.k * 2, ttl: 1.2, life: 1, color: TAGS.regen.color });
        else if (k === 'lightning') { const ang = Math.random() * Math.PI * 2; fx.push({ kind: 'shard', x: p.x + Math.cos(ang) * r * 0.9, y: p.y + Math.sin(ang) * r * 0.9, vx: Math.cos(ang) * 30, vy: Math.sin(ang) * 30, size: 1.5 + Math.random() * 1.5, ttl: 0.25, life: 1, color: TAGS.lightning.color, rot: ang }); }
        else if (k === 'frost') fx.push({ kind: 'flake', x: p.x + rx * 1.2, y: p.y - r * (0.9 + Math.random() * 0.4), vx: (Math.random() - 0.5) * 6, vy: 14 + Math.random() * 10, size: 1.4 + Math.random() * 1.6, ttl: 1.6, life: 1, color: '#d8f1ff' });
      }
    }
  }
  function shards(side) {
    const p = pos(side), r = radius(side);
    for (let i = 0; i < 14; i++) {
      const ang = Math.random() * Math.PI * 2, v = 60 + Math.random() * 90;
      fx.push({ kind: 'shard', x: p.x, y: p.y, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v - 40, g: 220, floor: p.y + r * 1.05, size: 2 + Math.random() * 3, ttl: 0.9, life: 1, color: '#bfe7ff', rot: ang });
    }
  }
  // A jagged bolt from above the stage down onto the target.
  function makeStrike(side) {
    const p = pos(side), r = radius(side);
    const pts = [];
    let x = p.x + (Math.random() - 0.5) * r;
    const y0 = 0, y1 = p.y;
    for (let i = 0; i <= 8; i++) {
      pts.push([x, y0 + ((y1 - y0) * i) / 8]);
      x += (Math.random() - 0.5) * r * 0.5;
      x += (p.x - x) * 0.25;
    }
    return { pts, life: 1 };
  }
  function drawStrikes(dt) {
    for (const st of strikes) {
      st.life -= dt * 3;

      ctx.save();
      ctx.globalAlpha = st.life;
      ctx.lineJoin = 'round';
      for (const [wd, col] of [[9, 'rgba(245,228,91,0.25)'], [4, TAGS.lightning.color], [1.5, '#fffbe0']]) {

  // An opponent you haven't been shown yet: a dark, hooded silhouette.
  function drawMystery(p, r) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + r * 1.05, r * 0.9, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(p.x, p.y - r * 0.2, 2, p.x, p.y, r * 1.2);
    g.addColorStop(0, 'rgba(60,52,70,0.9)'); g.addColorStop(1, 'rgba(15,13,18,0.95)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(214,162,78,0.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = `rgba(233,220,192,${0.55 + 0.15 * Math.sin(clock * 2)})`;
    ctx.font = `${Math.round(r * 1.1)}px "Grenze Gotisch", Georgia, serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('?', p.x, p.y + 4);
    ctx.font = '700 13px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = '#e9dcc0';
    ctx.fillText('Next opponent', p.x, p.y - r - 26);
    ctx.font = '600 11px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = '#a99c87';
    ctx.fillText('Revealed when the fight starts', p.x, p.y - r - 11);
  }

  // The standings, hung on the back wall. Plaques slide to their new place
  // when the order changes. Swords mark players whose fight is still going;
  // clicking those watches it.
  function drawBoard(dt) {
    plaqueRects = [];
    if (!board.length) return;
    const { floorTop, narrow } = stage();
    const n = board.length;
    const margin = narrow ? 8 : 24;
    const slot = (w - margin * 2) / n;
    const pw = Math.min(160, slot - 6), ph = narrow ? 26 : 40;
    const compact = pw < 92;
    const y = narrow ? 92 : Math.max(58, floorTop - ph - 26);
    const now = performance.now();
    board.forEach((b, i) => {
      const target = margin + slot * i + slot / 2;
      const cur = plaqueX[b.id] ?? target;
      plaqueX[b.id] = cur + (target - cur) * Math.min(1, dt * 6);
      const x = plaqueX[b.id] - pw / 2;
      const fighting = b.until > now;
      ctx.save();
      ctx.globalAlpha = b.out ? 0.45 : 1;
      ctx.fillStyle = 'rgba(20,17,24,0.82)';
      roundRect(x, y, pw, ph, 5); ctx.fill();
      ctx.lineWidth = b.me || b.foe ? 2 : 1;
      ctx.strokeStyle = b.me ? '#d6a24e' : b.foe ? '#d9505e' : 'rgba(214,162,78,0.25)';
      ctx.stroke();
      ctx.textBaseline = 'alphabetic';
      const hpw = pw - 12, hpy = y + ph - 9;
      ctx.fillStyle = '#2a2530'; ctx.fillRect(x + 6, hpy, hpw, 4);
      ctx.fillStyle = b.me ? '#7fca6e' : '#c9b79c';
      ctx.fillRect(x + 6, hpy, hpw * Math.max(0, Math.min(1, b.hp / b.max)), 4);
      ctx.fillStyle = '#e9dcc0';
      if (compact) {
        ctx.textAlign = 'center';
        ctx.font = '700 11px "Barlow Semi Condensed", system-ui, sans-serif';
        ctx.fillText(`${b.glyph} ${b.hp}`, x + pw / 2 - (fighting && narrow ? 5 : 0), y + 15);
      } else {
        ctx.textAlign = 'left';
        ctx.font = '700 12px "Barlow Semi Condensed", system-ui, sans-serif';
        let name = (b.place ? `${b.place}. ` : `${i + 1}. `) + b.name;
        while (ctx.measureText(name).width > pw - 34 && name.length > 3) name = name.slice(0, -2) + '…';
        ctx.fillText(name, x + 6, y + 14);
        ctx.font = '600 10px "Barlow Semi Condensed", system-ui, sans-serif';
        ctx.fillStyle = '#a99c87';
        ctx.fillText(b.char, x + 6, y + 26);
        ctx.textAlign = 'right';
        ctx.font = '700 12px "Barlow Semi Condensed", system-ui, sans-serif';
        ctx.fillStyle = '#e9dcc0';
        ctx.fillText(String(b.hp), x + pw - 6, y + 14);
        if (b.ready) { ctx.fillStyle = '#7fca6e'; ctx.fillText('✓', x + pw - 6, y + 26); }
      }
      if (fighting) {
        // Under the plaque; inside its right edge on narrow screens, where
        // the fighters' names sit just below.
        const sx = narrow ? x + pw - 8 : x + pw / 2, sy = narrow ? y + 9 : y + ph + 13, k = narrow ? 4 : 11;
        const swing = Math.sin(now / 160) * 0.25;
        ctx.strokeStyle = '#e9dcc0'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        // Two crossed swords: blade, crossguard and grip, clashing gently.
        for (const dir of [-1, 1]) {
          const a = dir * (0.8 + swing);
          const ux = Math.sin(a), uy = -Math.cos(a); // hilt to tip
          const hx = sx - ux * k, hy = sy - uy * k;

          ctx.beginPath(); ctx.moveTo(hx + ux * k * 0.35, hy + uy * k * 0.35); ctx.lineTo(sx + ux * k, sy + uy * k); ctx.stroke();
          ctx.strokeStyle = '#d6a24e';
          const gx = hx + ux * k * 0.35, gy = hy + uy * k * 0.35;
          ctx.beginPath(); ctx.moveTo(gx - uy * k * 0.35, gy + ux * k * 0.35); ctx.lineTo(gx + uy * k * 0.35, gy - ux * k * 0.35); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(gx, gy); ctx.stroke();

      }
      ctx.restore();
    });
  }
  function boardHit(ev) {
    const rc = canvas.getBoundingClientRect();
    const x = ev.clientX - rc.left, y = ev.clientY - rc.top;
    return plaqueRects.find((p) => x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + p.h);
  }
  canvas.addEventListener('click', (ev) => { const hit = boardHit(ev); if (hit && onPick) onPick(hit.id); });
  canvas.addEventListener('mousemove', (ev) => { canvas.style.cursor = boardHit(ev) ? 'pointer' : ''; });
  function setStandings(list, pick) {
    board = list;
    onPick = pick;
    start();
  }

  function drawFx(front) {
    for (const p of fx) {
      if ((p.kind === 'splat') === front) continue;
      const alpha = Math.max(0, Math.min(1, p.life * 1.4));
      ctx.globalAlpha = p.kind === 'splat' ? alpha * 0.7 : alpha;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;
      switch (p.kind) {
        case 'bubble':
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke();
          ctx.globalAlpha *= 0.35; ctx.fill();
          break;
        case 'drop':
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.7, p.size * 1.3, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case 'splat':
          ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 1.8, p.size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case 'flame': {
          const s = p.size * (0.4 + p.life * 0.6);
          ctx.fillStyle = p.life > 0.55 ? '#ffd27a' : p.color;
          ctx.beginPath(); ctx.moveTo(p.x, p.y - s * 1.8); ctx.quadraticCurveTo(p.x + s, p.y, p.x, p.y + s * 0.6); ctx.quadraticCurveTo(p.x - s, p.y, p.x, p.y - s * 1.8); ctx.fill();
          break;
        }
        case 'cross':
          ctx.fillRect(p.x - p.size, p.y - p.size * 0.3, p.size * 2, p.size * 0.6);
          ctx.fillRect(p.x - p.size * 0.3, p.y - p.size, p.size * 0.6, p.size * 2);
          break;
        case 'flake':
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
          break;
        case 'shard':
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + p.life * 4);
          ctx.beginPath(); ctx.moveTo(0, -p.size * 1.6); ctx.lineTo(p.size * 0.6, 0); ctx.lineTo(0, p.size * 1.6); ctx.lineTo(-p.size * 0.6, 0); ctx.closePath(); ctx.fill();

  function roundRect(x, y, ww, hh, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + ww, y, x + ww, y + hh, r);
    ctx.arcTo(x + ww, y + hh, x, y + hh, r);
    ctx.arcTo(x, y + hh, x, y, r);
    ctx.arcTo(x, y, x + ww, y, r);
    ctx.closePath();
  }

  // ------------------------------------------------------------ the stage
  function drawFloor(dt) {
    const { floorTop } = stage();
    // Back wall with the crowd along its top edge.
    const wall = ctx.createLinearGradient(0, 0, 0, floorTop);
    wall.addColorStop(0, '#100e13');
    wall.addColorStop(1, '#241d23');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, w, floorTop);
    ctx.fillStyle = '#1a161c';
    const crowdY = floorTop * 0.42;
    for (let i = 0; i < 46; i++) {
      const x = (i / 45) * w, hh = floorTop * (0.08 + ((i * 37) % 11) / 90);
      ctx.beginPath(); ctx.arc(x, crowdY - hh, Math.max(5, w / 90), 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - w / 110, crowdY - hh, w / 55, hh + 4);
    }
    ctx.fillStyle = '#2b2328';
    ctx.fillRect(0, crowdY, w, 5);
    // Stone blocks in the wall.
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    const rowH = (floorTop - crowdY) / 4;
    for (let r = 0; r < 4; r++) {
      const y = crowdY + 5 + r * rowH;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      const bw = w / 12;
      for (let x = (r % 2) * bw / 2; x < w; x += bw) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + rowH); ctx.stroke(); }
    }
    ctx.fillStyle = 'rgba(214,162,78,0.35)';
    ctx.fillRect(0, floorTop - 2, w, 2);

    // Floor: a trapezoid that narrows toward the wall.
    const inset = w * 0.16;
    ctx.fillStyle = '#120f14';
    ctx.fillRect(0, floorTop, w, h - floorTop);
    const fl = ctx.createLinearGradient(0, floorTop, 0, h);
    fl.addColorStop(0, '#3b3029');
    fl.addColorStop(1, '#5a4636');
    ctx.fillStyle = fl;
    ctx.beginPath(); ctx.moveTo(inset, floorTop); ctx.lineTo(w - inset, floorTop); ctx.lineTo(w + w * 0.04, h); ctx.lineTo(-w * 0.04, h); ctx.closePath(); ctx.fill();
    // Seams: lines toward the vanishing point, and rows that widen toward you.
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(14,12,17,0.35)';
    for (let c = 0; c <= 10; c++) {
      const t = c / 10;
      ctx.beginPath(); ctx.moveTo(inset + (w - 2 * inset) * t, floorTop); ctx.lineTo(-w * 0.04 + w * 1.08 * t, h); ctx.stroke();
    }
    for (let r = 1; r < 6; r++) {
      const y = floorTop + (h - floorTop) * (r / 6) ** 1.4;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    }
    // Torchlight pooling under the fighters.
    const g = ctx.createRadialGradient(w / 2, stage().feet, 10, w / 2, stage().feet, w * 0.5);
    g.addColorStop(0, 'rgba(255,190,120,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0.3)');
    ctx.fillStyle = g;
    ctx.fillRect(0, floorTop, w, h - floorTop);
    ctx.restore();
    ctx.strokeStyle = 'rgba(214,162,78,0.45)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-w * 0.04, h); ctx.lineTo(inset, floorTop); ctx.lineTo(w - inset, floorTop); ctx.lineTo(w + w * 0.04, h); ctx.stroke();

    if (!reduceMotion) {
      ctx.fillStyle = 'rgba(240,122,58,0.35)';
      for (const e of embers) {
        e.y -= e.v * dt;
        if (e.y < 0) { e.y = 1; e.x = Math.random(); }
        ctx.beginPath();
        ctx.arc(e.x * w, e.y * h, e.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function bar(x, y, ww, hh, frac, color, back = '#0e0c11') {
    ctx.fillStyle = back;
    roundRect(x, y, ww, hh, hh / 2); ctx.fill();
    if (frac > 0) {
      ctx.fillStyle = color;
      roundRect(x, y, Math.max(hh, ww * Math.min(1, frac)), hh, hh / 2); ctx.fill();
    }
  }
  // Dashes across an HP bar, one per `step` HP, with a heavier one every 1000,
  // so you can read how big a health pool is at a glance.
  function hpTicks(x, y, ww, hh, maxHp) {
    const step = [100, 200, 250, 500, 1000].find((s) => maxHp / s <= 24) || 2000;
    ctx.fillStyle = 'rgba(14,12,17,0.85)';
    for (let v = step; v < maxHp; v += step) {
      const tx = Math.round(x + (ww * v) / maxHp);
      const big = v % 1000 === 0;
      ctx.fillRect(tx - (big ? 1 : 0.5), y, big ? 2 : 1, big ? hh : hh * 0.6);
    }
  }

  // PixelLab characters stand on a canvas ~40% larger than the figure.
  function spriteBox(y, r) {
    return { size: r * 3.4, feet: y + r * 1.05 };
  }

  // Canvas sizes differ between characters, so sprites are scaled by the
  // figure in the base image: its height is 88% of the box, its feet on the
  // ground line. Measured once per character from the base image's pixels.
  function spriteFit(set) {
    if (set.fit) return set.fit;
    const base = set.base[0], w = base.naturalWidth, h = base.naturalHeight;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.drawImage(base, 0, 0);
    const px = g.getImageData(0, 0, w, h).data;
    let top = h, bottom = 0;
    for (let i = 3; i < px.length; i += 4) if (px[i] > 20) { const row = (i >> 2) / w | 0; top = Math.min(top, row); bottom = row + 1; }
    if (bottom <= top) { top = 0; bottom = h; }
    return (set.fit = { height: bottom - top, feet: bottom - h / 2 });
  }

  function spriteFrame(set, a) {
    const frames = set[a.clip] || set.idle || set.base;
    const n = frames.length;
    // Idle loops from its first frame each time it comes back, so it picks up
    // from the ready pose the other clips start and end on.
    const i = a.clip === 'idle' ? Math.floor(a.clipT * 8) % n
      : Math.min(n - 1, Math.floor((a.clipT / (CLIP[a.clip] || 0.4)) * n));
    return frames[i]?.complete && frames[i].naturalWidth ? frames[i] : set.base[0];
  }

  // tint: [color, alpha] laid over the figure; alpha: overall opacity.
  function drawSprite(u, set, a, x, y, r, { tint = null, alpha = 1 } = {}) {
    const img = spriteFrame(set, a);
    let src = img;
    if (tint) src = tinted(img, tint[0], tint[1]);
    // Clips can come on larger canvases than the base image (a wide swing
    // needs room), with the figure centred at the same pixel scale. So every
    // frame is drawn at the base image's scale around the same centre point.
    const { size, feet } = spriteBox(y, r);
    const fit = spriteFit(set);
    const scale = (size * 0.88) / fit.height;
    const cy = feet - fit.feet * scale;
    const dw = img.naturalWidth * scale, dh = img.naturalHeight * scale;
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = alpha * (u.dead && a.clip === 'death' && a.clipT > CLIP.death ? 0.55 : 1);
    ctx.translate(x, 0);
    if ((flip ? 1 - u.side : u.side) === 1) ctx.scale(-1, 1);
    ctx.drawImage(src, -dw / 2, cy - dh / 2, dw, dh);
    // The old clip's frame fades out on top while the new clip comes in.
    if (a.from) {
      const old = spriteFrame(set, { clip: a.from.clip, clipT: Math.min(a.from.clipT, CLIP[a.from.clip] || Infinity) });
      const ow = old.naturalWidth * scale, oh = old.naturalHeight * scale;
      ctx.globalAlpha *= 1 - a.clipT / BLEND;
      ctx.drawImage(tint ? tinted(old, tint[0], tint[1]) : old, -ow / 2, cy - oh / 2, ow, oh);
    }
    ctx.restore();
  }

  function drawMedallion(u, a, x, y, r, { tint = null, alpha = 1 } = {}) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const mg = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 2, x, y, r);
    mg.addColorStop(0, '#3b3442');
    mg.addColorStop(1, '#1b1820');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = TAGS[u.char.resources[0]].color;
    ctx.lineWidth = 3;
    ctx.stroke();
    if (u.char.resources[1]) {
      ctx.strokeStyle = TAGS[u.char.resources[1]].color;
      ctx.beginPath(); ctx.arc(x, y, r - 5, 0, Math.PI * 2); ctx.lineWidth = 1.5; ctx.stroke();
    }
    if (tint) {
      ctx.globalAlpha = alpha * tint[1] * 0.8;
      ctx.fillStyle = tint[0];
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = alpha;
    }
    if (u.dead) {
      ctx.fillStyle = 'rgba(10,8,12,0.6)';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#e9dcc0';
    ctx.font = `${Math.round(r * 0.95)}px "Grenze Gotisch", Georgia, serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.char.name.split(' ').map((s) => s[0]).join(''), x, y + 2);
    ctx.restore();
  }

  // A block of ice around a frozen fighter.
  function drawIce(x, y, r, t) {
    const top = y - r * 1.75, bottom = y + r * 1.1, half = r * 0.95;
    ctx.save();
    ctx.globalAlpha = Math.min(1, t * 3);
    ctx.fillStyle = 'rgba(150,215,250,0.28)';
    ctx.strokeStyle = 'rgba(220,245,255,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - half, bottom); ctx.lineTo(x - half * 1.08, y - r * 0.4); ctx.lineTo(x - half * 0.7, top + r * 0.2);
    ctx.lineTo(x - half * 0.1, top); ctx.lineTo(x + half * 0.75, top + r * 0.15); ctx.lineTo(x + half * 1.05, y - r * 0.5);
    ctx.lineTo(x + half, bottom); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - half * 0.55, top + r * 0.45); ctx.lineTo(x - half * 0.75, y);
    ctx.moveTo(x - half * 0.1, top + r * 0.1); ctx.lineTo(x + half * 0.2, y - r * 0.6);
    ctx.moveTo(x + half * 0.6, top + r * 0.5); ctx.lineTo(x + half * 0.7, y + r * 0.4);
    ctx.stroke();
    ctx.restore();
  }

  function drawUnit(u) {
    const p = pos(u.side);
    const r = radius(u.side);
    const a = anim[u.side];
    const dir = toward(u.side);
    if (mystery && u.side === 1) { drawMystery(p, r); return; }
    // Dodging hops back, away from the attacker.
    const hop = a.dodge > 0 ? Math.sin(Math.min(1, a.dodge) * Math.PI) : 0;
    const x = p.x + dir.x * (a.lunge * r * 0.5 - hop * r * 0.7);
    const y = p.y - hop * r * 0.15;

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(x, p.y + r * 1.05, r * 0.9, r * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    // frost creeping over the floor under a chilled fighter
    if (u.frost >= 1 || u.frozen > 0) {
      ctx.fillStyle = `rgba(160,220,250,${u.frozen > 0 ? 0.35 : Math.min(0.25, u.frost / 60)})`;
      ctx.beginPath(); ctx.ellipse(p.x, p.y + r * 1.05, r * 1.2, r * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    }

    // cast glow
    if (a.cast > 0) {
      ctx.strokeStyle = `rgba(181,156,240,${a.cast * 0.8})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r * (1.25 + (1 - a.cast) * 0.5), 0, Math.PI * 2); ctx.stroke();
    }
    // grit: a bronze ring while incoming damage is cut
    if (u.grit > 0) {
      ctx.strokeStyle = `rgba(214,162,78,${0.5 + 0.3 * Math.sin(clock * 12)})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(x, y, r + 20, 0, Math.PI * 2); ctx.stroke();
    }
    // shield ring
    if (u.shield > 0) {
      ctx.strokeStyle = 'rgba(233,238,245,0.85)';
      ctx.lineWidth = 2 + Math.min(8, (u.shield / u.maxHp) * 16);
      ctx.beginPath(); ctx.arc(x, y, r + 7, 0, Math.PI * 2); ctx.stroke();
    }
    // focus arc
    if (u.focusGain > 0 || u.focus > 0) {
      ctx.strokeStyle = TAGS.evasion.color;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, r + 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (u.focus / 1)); ctx.stroke();
    }

    const sprites = spriteSet(u.char.id);
    const figure = (fx0, fy0, opts) => (sprites ? drawSprite(u, sprites, a, fx0, fy0, r, opts) : drawMedallion(u, a, fx0, fy0, r, opts));
    // Evasion: afterimages left where the fighter was standing.
    if (a.dodge > 0 && !u.dead) {
      for (const k of [1, -1]) {
        figure(p.x - dir.x * hop * r * (k > 0 ? 0.25 : 0.5), p.y, { tint: [TAGS.evasion.color, 0.75], alpha: a.dodge * (k > 0 ? 0.5 : 0.3) });
      }
    }
    let tint = null;
    if (u.frozen > 0) tint = ['#6cc4f0', 0.5];
    else if (a.flash > 0) tint = ['#ff4a5a', a.flash * 0.55];
    else if (u.poison >= 1) tint = [TAGS.poison.color, Math.min(0.35, 0.1 + u.poison / 120) * (0.75 + 0.25 * Math.sin(clock * 4))];
    else if (u.frost >= 1) tint = ['#9fdcff', Math.min(0.3, u.frost / 50)];
    figure(x, y, { tint });
    if (u.frozen > 0 && !u.dead) drawIce(x, y, r, u.frozen);

    // bars
    // With a sprite, the bars sit above the figure's head instead of the medallion.
    const box = spriteBox(p.y, r);
    const bw = Math.min(220, Math.max(110, baseRadius() * 2.4)), bx = p.x - bw / 2, by = sprites ? box.feet - box.size * 0.86 - 18 : p.y - r - 34;
    const bh = 10;
    bar(bx, by, bw, bh, u.hp / u.maxHp, (flip ? 1 - u.side : u.side) === 0 ? '#7fca6e' : '#d9505e');
    if (u.shield > 0) {
      ctx.fillStyle = 'rgba(233,238,245,0.9)';
      const sx = bx + bw * Math.min(1, u.hp / u.maxHp);
      roundRect(Math.min(sx, bx + bw - 3), by, Math.max(3, Math.min(bw * (u.shield / u.maxHp), bx + bw - sx)), bh, 3);
      ctx.fill();
    }
    hpTicks(bx, by, bw, bh, u.maxHp);
    if (u.poison >= 1 || u.bleed >= 1) {
      // A thin line under the HP bar in the color of the damage over time.
      ctx.fillStyle = u.bleed > u.poison ? TAGS.bleed.color : TAGS.poison.color;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(clock * 6);
      ctx.fillRect(bx + 2, by + bh, bw - 4, 1.5);
      ctx.globalAlpha = 1;
    }
    bar(bx, by + bh + 3, bw, 4, u.mana / (u.manaMax * u.m.castCost), '#5b8cff');
    // Player name over gladiator name, with HP on the right.
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.font = '700 13px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = '#e9dcc0';
    const who = names[u.side] || u.char.name;
    ctx.fillText(who, bx, by - (names[u.side] ? 18 : 5));
    if (names[u.side]) {
      ctx.font = '600 11px "Barlow Semi Condensed", system-ui, sans-serif';
      ctx.fillStyle = '#a99c87';
      ctx.fillText(u.char.name, bx, by - 5);
    }
    ctx.textAlign = 'right';
    ctx.font = '700 12px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = '#e9dcc0';
    ctx.fillText(`${Math.ceil(u.hp)}`, bx + bw, by - 5);

    // stacks
    const chips = [];
    for (const k of SELF_STACKS) if (u[k] >= 1) chips.push({ k, v: u[k], mine: true });
    if (u.focusGain > 0 || u.focus > 0) chips.push({ k: 'evasion', v: Math.round(u.focus * 100) + '%', mine: true });
    for (const k of ON_ME) if (u[k] >= 1) chips.push({ k, v: u[k], mine: false });
    const cw = 46, ch = 20, gap = 4;
    const perRow = Math.max(2, Math.floor((w * 0.4) / (cw + gap)));
    ctx.textBaseline = 'middle';
    chips.forEach((c, i) => {
      const row = Math.floor(i / perRow), col = i % perRow;
      const n = Math.min(perRow, chips.length - row * perRow);
      const cx = p.x - (n * (cw + gap) - gap) / 2 + col * (cw + gap);
      const cy = p.y + r * 1.05 + 14 + row * (ch + gap);
      const color = TAGS[c.k].color;
      ctx.fillStyle = '#15131acc';
      roundRect(cx, cy, cw, ch, 4); ctx.fill();
      ctx.fillStyle = color + '22';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash(c.mine ? [] : [3, 2]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color;
      ctx.font = '700 11px "Barlow Semi Condensed", system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(TAGS[c.k].glyph, cx + 5, cy + ch / 2 + 1);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#e9dcc0';
      ctx.fillText(typeof c.v === 'number' ? Math.floor(c.v) : c.v, cx + cw - 5, cy + ch / 2 + 1);
    });
  }

  // The fight clock: elapsed time, with a bar that fills toward overtime
  // (30s) and then the arena burn (60s).
  function drawClock(t) {
    const o = overtime(t);
    const top = w < 640 ? 36 : 0; // below the speed buttons on narrow screens
    const bw = Math.min(360, w * 0.5), bx = w / 2 - bw / 2, by = top + 32, bh = 6;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '600 14px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = t > SUDDEN_DEATH_AT ? '#d9505e' : '#e9dcc0';
    const label = t > BURN_AT
      ? `${t.toFixed(1)}s · ARENA BURN ${(o.burn * 100).toFixed(1)}% max HP/s · +${Math.round((o.damage - 1) * 100)}% damage`
      : t > SUDDEN_DEATH_AT
        ? `${t.toFixed(1)}s · OVERTIME +${Math.round((o.damage - 1) * 100)}% damage · ${Math.round(o.healing * 100)}% healing and shields`
        : `${t.toFixed(1)}s`;
    ctx.fillText(label, w / 2, top + 18);
    // Track: the overtime stretch is tinted so you can see it coming.
    const ot = bx + bw * (SUDDEN_DEATH_AT / BURN_AT);
    ctx.fillStyle = '#0e0c11';
    roundRect(bx, by, bw, bh, 3); ctx.fill();
    ctx.fillStyle = 'rgba(217,80,94,0.22)';
    ctx.fillRect(ot, by, bx + bw - ot, bh);
    const frac = Math.min(1, t / BURN_AT);
    const fillW = bw * frac;
    if (fillW > 0) {
      ctx.fillStyle = '#a99c87';
      ctx.fillRect(bx, by, Math.min(fillW, ot - bx), bh);
      if (fillW > ot - bx) { ctx.fillStyle = '#d9505e'; ctx.fillRect(ot, by, fillW - (ot - bx), bh); }
    }
    if (t > BURN_AT) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(clock * 8);
      ctx.fillStyle = '#f0a43a';
      roundRect(bx, by, bw, bh, 3); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = '#e9dcc0';
    ctx.fillRect(ot - 1, by - 3, 2, bh + 6);
    ctx.font = '700 10px "Barlow Semi Condensed", system-ui, sans-serif';
    ctx.fillStyle = t > SUDDEN_DEATH_AT ? '#d9505e' : '#a99c87';
    ctx.fillText(`OVERTIME ${SUDDEN_DEATH_AT}s`, ot, by + bh + 10);
    ctx.textAlign = 'right';
    ctx.fillStyle = t > BURN_AT ? '#f0a43a' : '#a99c87';
    ctx.fillText(`BURN ${BURN_AT}s`, bx + bw, by + bh + 10);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#a99c87';
    ctx.fillText('0s', bx, by + bh + 10);
  }

  function draw(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawFloor(dt);
    drawBoard(dt);
    if (!units) return;
    drawFx(true);
    for (const u of units) drawUnit(u);
    drawFx(false);
    drawStrikes(dt);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (fight) drawClock(fight.t);
    const mid = { x: w / 2, y: pos(0).y };
    ctx.font = `${Math.round(baseRadius() * 0.6)}px "Grenze Gotisch", Georgia, serif`;
    ctx.fillStyle = 'rgba(214,162,78,0.55)';
    ctx.fillText('vs', mid.x, mid.y);
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.font = `700 ${f.size}px "Barlow Semi Condensed", system-ui, sans-serif`;
      ctx.fillStyle = '#0e0c11';
      ctx.fillText(f.text, f.x + 1, f.y + 1);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }

  function destroy() {
    cancelAnimationFrame(raf);
    raf = 0;
    ro?.disconnect();
    if (fight) fight.onEvent = null;
  }

  return { setPreview, play, skip, setSpeed, setStandings, destroy, get playing() { return !!(fight && onDone); } };
}

// ---------------------------------------------------------------- card text

function tagTip(tag) {
  const t = TAGS[tag];
  return `<b style="color:${t.color}">${t.name}</b> <span class="tip-kind">${t.kind}</span><br>${esc(t.kind === 'trigger' ? t.passive : t.stack)}`;
}

function chip(tag, withName = false) {
  const t = TAGS[tag];
  return `<span class="chip ${t.kind}" style="--c:${t.color}" data-tip="${esc(tagTip(tag))}">${withName ? t.name : t.glyph}</span>`;
}

// Keywords in card text get their tag's color and a hover explanation.
const KEYWORDS = /\b(On attack|On crit|On dodge|On cast|On heal|When hurt|Fire|Frost|Toxin|Bleed|Shield|Regen|Arcane|Lightning|Armor|Focus|Grit)\b/g;
const KEYWORD_TAG = { 'On attack': 'strike', 'On crit': 'precision', 'On dodge': 'evasion', 'On cast': 'spell', 'On heal': 'regen', 'When hurt': 'pain', Toxin: 'poison', Focus: 'evasion' };
const GRIT_TIP = '<b style="color:#d6a24e">Grit</b> <span class="tip-kind">everyone</span><br>Lose 30% of your max HP within 2s and you take 50% less damage for 1.5s. Once every 6s.';
function richText(text) {
  return esc(text).replace(KEYWORDS, (w) => {
    if (w === 'Grit') return `<span class="kw" style="--c:#d6a24e" data-tip="${esc(GRIT_TIP)}">${w}</span>`;
    const tag = KEYWORD_TAG[w] || w.toLowerCase();
    return `<span class="kw" style="--c:${TAGS[tag].color}" data-tip="${esc(tagTip(tag))}">${w}</span>`;
  });
}

// Card text with every number that changes with copies underlined. Hovering
// one shows its value at each copy count.
function richDesc(card, n) {
  const split = (s) => s.split(/(\d+(?:\.\d+)?)/);
  const cur = split(card.desc(n));
  const variants = card.max > 1 ? Array.from({ length: card.max }, (_, k) => split(card.desc(k + 1)).filter((_, i) => i % 2)) : [];
  const aligned = variants.length && variants.every((v) => v.length === (cur.length - 1) / 2);
  return cur.map((part, i) => {
    if (i % 2 === 0) return richText(part);
    const vals = aligned ? variants.map((v) => v[(i - 1) / 2]) : [];
    if (new Set(vals).size < 2) return esc(part);
    const tip = `<b>Scales with copies</b><div class="tip-rows">${vals.map((v, k) =>
      `<span class="${k + 1 === n ? 'cur' : ''}">${k + 1} ${k ? 'copies' : 'copy'}<b class="num">${v}</b></span>`).join('')}</div>`;
    return `<span class="scale" data-tip="${esc(tip)}">${part}</span>`;
  }).join('');
}

function cardTags(card) {
  if (card.tier === 'counter') return `<span class="chip" style="--c:#b9b2a6">Counter</span>${card.counters ? `<span class="arrow">vs</span>${chip(card.counters, true)}` : ''}`;
  const trig = card.tags.filter((t) => TRIGGERS.includes(t));
  const res = cardResources(card);
  if (trig.length && res.length) return `${chip(trig[0], true)}<span class="arrow">&#9656;</span>${chip(res[0], true)}`;
  return card.tags.map((t) => chip(t, true)).join('');
}

const SOURCE_COLOR = {

  Shatter: TAGS.frost.color, Pandemic: TAGS.poison.color, 'Reflective Plating': TAGS.shield.color, 'Undying Spite': TAGS.pain.color,
  Regen: TAGS.regen.color, 'Bleed lifesteal': TAGS.bleed.color, 'Plague Lord': TAGS.poison.color, 'Phoenix Core': TAGS.fire.color,
  Armor: TAGS.armor.color, Shield: TAGS.shield.color, Dodge: TAGS.evasion.color, Resistances: '#b9b2a6', Immunity: '#e9dcc0',
  'Living Mountain': TAGS.armor.color, 'Mana Shield': TAGS.arcane.color, 'Arena burn': '#d6a24e',
  Lightning: TAGS.lightning.color, 'Chain Lightning': TAGS.lightning.color, Tempest: TAGS.lightning.color, Grit: '#d6a24e',
};
function statGroup(title, table) {
  const rows = Object.entries(table || {}).filter(([, v]) => v >= 1).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((s, [, v]) => s + v, 0);
  const max = rows.length ? rows[0][1] : 1;
  return `<div class="sg">
    <div class="sg-h"><span>${title}</span><span class="num">${Math.round(total)}</span></div>
    ${rows.length ? rows.map(([k, v]) => `<div class="sr"><span class="sn">${esc(k)}</span><span class="sb"><i style="width:${(v / max) * 100}%;background:${SOURCE_COLOR[k] || TAGS.spell.color}"></i></span><span class="sv num">${Math.round(v)}</span></div>`).join('') : '<div class="sr none">None</div>'}
  </div>`;
}
function statsPanel(side) {
  const fs = ui.fightStats;

  const s = fs.stats[side];
  return `<div class="eyebrow">${fs.watched ? 'Watched fight' : fs.live ? 'This fight' : `Last fight · round ${fs.round}`}</div>
    ${statGroup('Damage dealt', s.dmg)}${statGroup('Healing', s.heal)}${statGroup('Damage prevented', s.mit)}`;
}
function refreshStats() {
  for (const [id, side] of [['stats-mine', 0], ['stats-foe', 1]]) {

// ---------------------------------------------------------------- records

function record(level) { return store.get('record-' + level, { w: 0, l: 0 }); }
function ffaRecord() { return store.get('ffa', { games: 0, wins: 0, places: 0 }); }
function saveResult() {
  if (S.mode !== 'solo' || savedResultFor === M()) return;
  savedResultFor = M();
  const me = M().players[ME()];
  if (isDuel()) {
    const lv = M().players[1].level || 'normal';
    const r = record(lv);
    if (me.placement === 1) r.w++; else r.l++;
    store.set('record-' + lv, r);
  } else {
    const r = ffaRecord();
    r.games++; r.places += me.placement; if (me.placement === 1) r.wins++;
    store.set('ffa', r);
  }
}

function toast(msg) {
  clearTimeout(toastTimer);
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg;
  el.hidden = false;
  toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

function useSession(session) {
  S?.close?.();
  S = session;
  ui.banner = null; ui.fightStats = null; ui.animRound = null; ui.fighting = false; ui.watching = null; ui.error = null;
  lastCounts = null;
  S.onChange(onSessionChange);
  render();
}

function leave() {
  S?.close?.();
  S = null;
  render();
}

function startSolo() {
  store.set('lobby', ui.lobby);
  store.set('solo-time', ui.soloTime);
  useSession(soloSession({ bots: ui.lobby, shopTime: ui.soloTime }));
}

async function startOnline(kind) {
  const name = cleanName(root.querySelector('#name')?.value || ui.name);
  ui.name = name;
  store.set('name', name);
  ui.busy = true; ui.error = null; render();
  try {
    if (kind === 'host') useSession(await hostSession({ name, kind: NET_KIND }));
    else {
      const code = cleanCode(root.querySelector('#code')?.value || ui.joinCode);
      ui.joinCode = code;
      if (code.length !== 5) throw new Error('Room codes are 5 letters.');
      useSession(await clientSession({ code, name, kind: NET_KIND }));
    }
  } catch (e) {
    ui.error = e.message || String(e);
  }
  ui.busy = false;
  render();
}

function onSessionChange() {
  const m = M();
  if (m && S.stage === 'game') {
    // Toast tier and hybrid unlocks after your purchases land.
    const me = m.players[ME()];
    const counts = me ? tagCounts(me.cards) : {};
    if (lastCounts && m.phase === 'shop') {
      for (const t of Object.keys(counts)) for (const k of [2, 3, 4]) {
        if ((lastCounts[t] || 0) < TIER_UNLOCK[k] && counts[t] >= TIER_UNLOCK[k]) toast(`${TAGS[t].name} ${TIER_NAMES[k]} cards unlocked`);
      }
      for (const h of CARDS.filter((c) => c.tier === 'hybrid')) {
        if (!h.tags.some((t) => m.bans.includes(t)) && h.tags.every((t) => (counts[t] || 0) >= HYBRID_REQ) && !h.tags.every((t) => (lastCounts[t] || 0) >= HYBRID_REQ)) toast(`Hybrid unlocked: ${h.name}`);
      }
    }
    lastCounts = counts;
    if (m.phase !== 'fight' && ui.banner) ui.banner = null;
    if (m.phase !== 'fight' && (ui.fighting || ui.watching)) arena?.skip();
  }
  render();
  if (m && S.stage === 'game' && m.phase === 'fight' && ui.animRound !== m.fightRound) {
    ui.animRound = m.fightRound;
    ui.fightSeenAt = performance.now();
    if ((m.watchers || []).includes(ME()) || (m.players[ME()].hp > 0 && opponentOf(m, ME()))) startFightAnimation();
    else {
      ui.banner = resultsBanner(null);
      updateGame();
      // Knocked out (or sitting this round out): watch a fight live instead
      // of only reading the results. Prefer one with a person in it.
      const pick = m.lastResults.findIndex((r) => !m.players[r.a].isBot || !m.players[r.b].isBot);
      if (m.lastResults.length) watchFight(Math.max(0, pick));
    }
  }
}

// ---------------------------------------------------------------- screens

function screenFor() {
  if (!S || S.stage === 'connecting') return 'title';
  if (S.stage === 'closed') return 'closed';
  if (S.stage === 'lobby') return 'room';
  const m = M();
  if (!m) return 'waiting';
  if (m.phase === 'ban') return 'ban';
  if (m.phase === 'pick') return 'pick';
  if (m.phase === 'over') return 'over';
  return 'game';
}

function render() {
  const screen = screenFor();
  if (screen !== 'game' && arena) { arena.destroy(); arena = null; }
  if (screen !== 'game') { const t = document.querySelector('.toast'); if (t) t.hidden = true; }
  if (screen === 'title') return renderTitle();
  if (screen === 'room') return renderRoom();
  if (screen === 'closed') return renderClosed();
  if (screen === 'waiting') return renderWaiting('Starting the match...');
  if (screen === 'ban') return renderBan();
  if (screen === 'pick') return renderPick();
  if (screen === 'over') return renderOver();
  return renderGame();
}

const fmtTime = (r) => { const s = Math.ceil(r); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function timerHtml() {
  const r = S?.remaining?.();
  if (r == null) return '';
  return `<span class="timer ${r <= 5 ? 'urgent' : ''}" data-timer>${fmtTime(r)}</span>`;
}
setInterval(() => {
  const r = S?.remaining?.();
  for (const el of root.querySelectorAll('[data-timer]')) {
    if (r == null) { el.textContent = ''; continue; }
    el.textContent = fmtTime(r);
    el.classList.toggle('urgent', r <= 5);
  }
}, 250);

const RULES = () => `

    <div class="rule"><h3>Triggers and resources</h3><p>Triggers decide <i>when</i> you gain stacks (Strike, Crit, Dodge, Health, Spell). Resources decide <i>what</i> stacks do. A card like ${chip('precision', true)} <span class="arrow">&#9656;</span> ${chip('poison', true)} always fires. Cards with only a resource fire 30% of the time.</p></div>
    <div class="rule"><h3>Build up, unlock more</h3><p>Own ${TIER_UNLOCK[2]}, ${TIER_UNLOCK[3]} and ${TIER_UNLOCK[4]} cards of a tag to unlock its Uncommon, Rare and Mythic cards. Own ${HYBRID_REQ} of two resources to unlock their Hybrid card.</p></div>
    <div class="rule"><h3>Bans</h3><p>Every gladiator secretly votes to ban one resource, and the ${BAN_COUNT} with the most votes are banned. Banned cards never appear, and gladiators who only use banned resources sit the match out.</p></div>
    <div class="rule"><h3>Focus, not luck</h3><p>Dodging builds Focus. Every hit you take adds to your dodge chance, and a dodge resets it, so you can never dodge twice in a row. Toxin, Bleed and abilities can't be dodged.</p></div>
    <div class="rule"><h3>Grit</h3><p>Anyone who loses 30% of their max HP within 2 seconds takes half damage for the next 1.5 seconds, at most once every 6 seconds. Freezes also get harder: each one needs 10 more Frost than the last.</p></div>

function renderRoom() {
  const hosting = S.mode === 'host';
  const lobby = hosting ? { code: S.code, shopTime: S.shopTime, slots: S.slots } : S.lobby;
  const link = `${location.origin}${location.pathname}?room=${lobby.code}${NET_KIND === 'local' ? '&net=local' : ''}`;
  const filled = lobby.slots.filter((x) => x.kind !== 'open').length;
  root.innerHTML = `
  <div class="screen"><div class="screen-inner">
    <div>
      <div class="eyebrow">${hosting ? 'You are hosting' : 'You joined'} · ${filled} of ${lobby.slots.length} slots filled</div>
      <h1 style="font-size:48px">Room <span class="room-code num">${esc(lobby.code)}</span></h1>
      <div class="row"><input class="link" id="link" readonly value="${esc(link)}" aria-label="Invite link"><button class="btn" id="copy">Copy invite link</button></div>
    </div>
    <div class="lobby">
      <div class="slots">
        ${lobby.slots.map((x, i) => roomSlot(x, i, hosting)).join('')}
        ${hosting && lobby.slots.length < MAX_PLAYERS ? `<button class="slot add" id="add-slot"><span class="slot-n">+</span><b>Add a slot</b><span class="slot-note">Open for a player</span></button>` : ''}
      </div>

      <div class="row">
        ${hosting ? `<button class="btn primary big" id="start" ${S.canStart() ? '' : 'disabled'}>Start the match</button>
          <span class="slot-note">${S.canStart() ? 'Slots still marked Open are dropped when the match starts.' : 'You need at least one rival: a player or a bot.'}</span>`
          : '<span class="slot-note waiting">Waiting for the host to start the match...</span>'}
        <button class="btn" id="leave">${hosting ? 'Close the room' : 'Leave the room'}</button>
      </div>
    </div>
  </div></div>`;
  root.querySelector('#copy').onclick = () => {
    const input = root.querySelector('#link');
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => toast('Invite link copied.'), () => { input.select(); toast('Press Ctrl+C to copy.'); });
    else input.select();
  };
  root.querySelector('#leave').onclick = leave;
  if (!hosting) return;
  root.querySelector('#start').onclick = () => S.start();
  root.querySelector('#add-slot')?.addEventListener('click', () => S.addSlot());
  root.querySelectorAll('#room-time [data-time]').forEach((b) => b.onclick = () => S.setShopTime(Number(b.dataset.time)));
  root.querySelectorAll('[data-kind]').forEach((b) => b.onclick = () => {

  });
  root.querySelectorAll('[data-room-slot]').forEach((b) => b.onclick = () => S.setSlot(Number(b.dataset.roomSlot), { kind: 'bot', level: b.dataset.slotLevel }));
  root.querySelectorAll('[data-remove-slot]').forEach((b) => b.onclick = () => S.removeSlot(Number(b.dataset.removeSlot)));
}

function roomSlot(x, i, hosting) {
  const you = hosting ? x.kind === 'host' : S.slot === i;
  let body;
  if (x.kind === 'host') body = `<b>${esc(x.name)}</b><span class="slot-note">Host${you ? ' (you)' : ''}</span>`;
  else if (x.kind === 'human') body = `<b>${esc(x.name)}</b><span class="slot-note">Player${you ? ' (you)' : ''}</span>`;
  else if (x.kind === 'bot') body = `<b>Bot</b>${hosting ? levelSeg(i, x.level, 'Bot', 'data-room-slot') : `<span class="slot-note">${DIFFICULTY[x.level].name}</span>`}`;
  else body = `<b class="open">Open</b><span class="slot-note">Waiting for a player to join</span>`;
  const controls = hosting && x.kind !== 'host' ? `<span class="slot-ctl">
      ${x.kind === 'open' ? `<button class="slot-x" data-kind="bot" data-i="${i}">Fill with a bot</button>` : ''}
      ${x.kind === 'bot' ? `<button class="slot-x" data-kind="open" data-i="${i}">Open for a player</button>` : ''}
      ${S.slots.length > 2 ? `<button class="slot-x" data-remove-slot="${i}" aria-label="Remove slot ${i + 1}">${x.kind === 'human' ? 'Kick' : 'Remove'}</button>` : ''}
    </span>` : '<span></span>';
  return `<div class="slot ${you ? 'you' : ''} room"><span class="slot-n num">${i + 1}</span>${body}${controls}</div>`;
}

function updateGame() {
  if (!root.querySelector('.game')) return;
  const m = M();
  renderHud();
  const w = ui.watching;
  if (w) {
    renderSide('mine', m.players[w.a], false, 'Watching');
    renderSide('foe', m.players[w.b], false, w.ghost ? 'Watching · a ghost copy of' : 'Watching');
  } else {
    renderSide('mine', m.players[ME()], true);
    if (foe() && !foeRevealed()) renderShroud('foe');
    else renderSide('foe', (foe() || { p: m.players.find((p) => p.id !== ME()) }).p, false);
  }
  renderBoard();
  renderTray();
  renderSpeed();
  renderPreview();
  renderBanner();
  renderModal();
  renderTabs();
}

function renderHud() {
  const m = M();
  const me = m.players[ME()], f = foe();

    <div class="life ${cls}">
      <div class="top"><span>${ghost ? 'Ghost of ' : ''}${esc(nameOf(p))} · ${esc(CHAR_BY_ID[p.charId].name)}</span><span class="num">${hpOf(p)} / ${START_HP}</span></div>
      <div class="bar hp-dashes"><i style="width:${(hpOf(p) / START_HP) * 100}%"></i></div>
    </div>`;
  root.querySelector('#hud').innerHTML = `

    ${roundsStrip()}
    <div class="vs">${life(me, 'me')}${f ? (foeRevealed() ? life(f.p, 'foe', f.ghost) : `

      <div class="bar hp-dashes"><i style="width:0"></i></div>
